<!doctype html>
<meta charset="utf-8">
<title>redline view</title>
<body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script type="module">
// 赤いラインの自動検出と、壁と氷の境目を絵で確かめる：?img=画像
import { findRedLine, wallEdge, isLineRed } from '../vision.js';
const im = new Image(); im.src = new URLSearchParams(location.search).get('img'); await im.decode();
const W = im.naturalWidth, H = im.naturalHeight, c = document.getElementById('c'); c.width = W; c.height = H;
const x = c.getContext('2d'); x.drawImage(im, 0, 0);
const d = x.getImageData(0, 0, W, H).data;
for (let y = 0; y < H; y++) for (let i = 0; i < W; i++) { const k = (y * W + i) * 4; if (isLineRed(d[k], d[k + 1], d[k + 2])) { x.fillStyle = 'rgb(0 255 0 / .6)'; x.fillRect(i, y, 1, 1); } }
const e = wallEdge(d, W, H);
if (e) { x.strokeStyle = '#ff0'; x.lineWidth = 2; x.beginPath(); x.moveTo(0, e(0)); x.lineTo(W, e(W)); x.stroke(); }
globalThis.__RL = []; const l = findRedLine(im, W, H);
if (l) { x.strokeStyle = '#f0f'; x.lineWidth = 4; x.beginPath(); x.moveTo(l[0][0] * W, l[0][1] * H); x.lineTo(l[1][0] * W, l[1][1] * H); x.stroke(); }
window.result = { edge: !!e, line: l, c: globalThis.__RL.slice(0, 3) };
</script>
