<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141236">
<title>よていパズル</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="よていパズル">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=DM+Mono:wght@500&display=swap">
<style>
/* レイアウト：1画面＝1つの仕事。上に見出し、まん中に中身、下に大きなボタン。見た目はA（パズル）：夜空の背景と、つやのあるブロック */
:root{
  --night:#141236; --deep:#2c2870; --deep2:#24206a; --well:rgb(10 8 40 / .45);
  --text:#ffffff; --dim:#cfcaff; --gold1:#ffd23f; --gold2:#ffb200; --gold-ink:#3a2300; --bad:#ff4d4d; --now:#ff4d6d;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"DM Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#3a2f8f 0%,#1d1a4a 55%,#141236 100%) fixed,var(--night);color:var(--text);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:disabled{cursor:default}
input{font:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--gold1);outline-offset:2px;border-radius:8px}
.app{position:fixed;inset:0;display:flex;justify-content:center}
.scr{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow:hidden}
.glossy{background:var(--cc);color:#fff;box-shadow:inset 0 3px 0 rgb(255 255 255 / .35),inset 0 -5px 0 rgb(0 0 0 / .22);text-shadow:0 1px 0 rgb(0 0 0 / .22)}
.gold{background:linear-gradient(var(--gold1),var(--gold2));color:var(--gold-ink);box-shadow:inset 0 -5px 0 rgb(0 0 0 / .18),0 6px 18px rgb(255 190 0 / .25)}
.deep{background:var(--deep);box-shadow:inset 0 -4px 0 rgb(0 0 0 / .25)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgb(255 255 255 / .1);flex:none;font-size:1.1rem}
.icon svg{display:block}
.big-btn{min-height:54px;border-radius:18px;font-weight:800;font-size:1.02rem;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.big-btn:disabled{filter:grayscale(.85);opacity:.45}
.sm-btn{min-height:42px;border-radius:13px;padding:0 14px;font-weight:800;font-size:.88rem;white-space:nowrap}
.ttl{font-size:1.35rem;font-weight:800;line-height:1.25}
.sub{font-size:.75rem;color:var(--dim);font-weight:800;letter-spacing:.06em}
.mono{font-family:var(--mono)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.empty{text-align:center;color:var(--dim);padding:36px 0;margin:auto}

/* ホーム */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:none}
.week button{min-height:60px;border-radius:14px;display:grid;justify-items:center;align-content:center;gap:2px;background:rgb(0 0 0 / .22)}
.week .w{font-size:.68rem;color:var(--dim)}
.week .n{font-family:var(--mono);font-size:1.02rem}
.week .mk{font-size:.6rem;height:12px;line-height:12px;color:var(--gold1)}
.week button.on{background:var(--deep);box-shadow:inset 0 -4px 0 rgb(0 0 0 / .3),0 0 0 2px var(--gold1)}
.week button.today .w{color:var(--gold1)}
.card{border-radius:22px;background:rgb(0 0 0 / .25);padding:12px 10px 10px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.nowbox{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:.9rem;padding:0 4px}
.nowbox .lb{font-size:.7rem;font-weight:800;border-radius:8px;padding:2px 8px;background:var(--now)}
.nowbox .lb.nx{background:rgb(255 255 255 / .18)}
.nowbox b{font-weight:800}
.nowbox .tm{font-family:var(--mono);font-size:.78rem;color:var(--dim)}
.hbar{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.hb{flex:1;min-height:120px;position:relative;border-radius:14px;background:rgb(0 0 0 / .3);overflow:hidden}
.hb .seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-right:1px solid rgb(0 0 0 / .25)}
.hb .seg.free{background:repeating-linear-gradient(135deg,rgb(255 255 255 / .12) 0 8px,rgb(255 255 255 / .05) 8px 16px);box-shadow:none;color:var(--dim);text-shadow:none}
.hb .seg.cur{box-shadow:inset 0 0 0 3px var(--gold1);z-index:1}
.hb .vt{writing-mode:vertical-rl;text-orientation:upright;font-weight:800;font-size:.82rem;letter-spacing:.05em;white-space:nowrap;line-height:1}
.hb .gl{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed rgb(255 255 255 / .18);pointer-events:none;z-index:2}
.hb .hnow{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--now);z-index:3;box-shadow:0 0 8px var(--now)}
.hticks{position:relative;height:14px;font-family:var(--mono);font-size:10px;color:rgb(255 255 255 / .55)}
.hticks span{position:absolute;transform:translateX(-50%)}
.hticks span:first-child{transform:none}
.hticks span:last-child{transform:translateX(-100%)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.night{flex:none;border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#3b2f9a,#5b3fc4);box-shadow:inset 0 3px 0 rgb(255 255 255 / .2),inset 0 -5px 0 rgb(0 0 0 / .25),0 0 0 2px var(--gold1)}
.night.ok{box-shadow:inset 0 3px 0 rgb(255 255 255 / .2),inset 0 -5px 0 rgb(0 0 0 / .25)}
.night .moon{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c9,#ffd23f 60%,#e0a800);box-shadow:0 0 16px rgb(255 210 63 / .55);flex:none}
.night b{font-size:.95rem;display:block}
.night p{margin:0;font-size:.75rem;color:var(--dim)}

/* ① 選ぶ */
.mini-seg{display:flex;background:rgb(0 0 0 / .3);border-radius:12px;padding:3px;gap:2px}
.mini-seg button{min-height:36px;min-width:52px;border-radius:9px;font-size:.8rem;font-weight:800;color:var(--dim)}
.mini-seg button.on{background:var(--deep);color:#fff}
.edit-btn{min-height:36px;border-radius:10px;padding:0 12px;font-size:.8rem;font-weight:800;background:rgb(255 255 255 / .1)}
.edit-btn.on{background:#ff5d7a}
.pick-list{display:flex;flex-direction:column;gap:6px;margin:0 -10px;padding:4px 10px 10px}
.genre{font-size:.75rem;font-weight:800;letter-spacing:.1em;color:var(--dim);margin:10px 2px 2px;display:flex;align-items:center;gap:6px;min-height:28px}
.genre i{width:8px;height:8px;border-radius:2px;background:var(--gc)}
.genre .gx{margin-left:auto;min-height:30px;padding:0 10px;border-radius:8px;background:#ff4d6d;color:#fff;font-size:.72rem;font-weight:800;letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tile{height:64px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:.78rem;line-height:1.2;text-align:center;padding:0 2px;position:relative;background:var(--deep);box-shadow:inset 0 -4px 0 rgb(0 0 0 / .25);transition:transform .12s}
.tile:active{transform:scale(.94)}
.tile .ic{width:18px;height:18px;border-radius:6px;background:var(--cc);box-shadow:inset 0 2px 0 rgb(255 255 255 / .4),inset 0 -2px 0 rgb(0 0 0 / .25)}
.tile.on{background:var(--cc);box-shadow:inset 0 3px 0 rgb(255 255 255 / .35),inset 0 -5px 0 rgb(0 0 0 / .25);text-shadow:0 1px 0 rgb(0 0 0 / .25)}
.tile.on .ic{background:rgb(255 255 255 / .35)}
.tile .ck{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:#fff;color:#1d1a4a;font-size:11px;display:grid;place-items:center}
.tile.has{opacity:.55}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{position:relative;min-height:42px;border-radius:999px;padding:0 15px;font-weight:800;font-size:.9rem;display:inline-flex;align-items:center;gap:8px;background:var(--deep);box-shadow:inset 0 -3px 0 rgb(0 0 0 / .25)}
.tag i{width:11px;height:11px;border-radius:50%;background:var(--cc)}
.tag.on{background:var(--cc);box-shadow:inset 0 3px 0 rgb(255 255 255 / .3),inset 0 -4px 0 rgb(0 0 0 / .22);text-shadow:0 1px 0 rgb(0 0 0 / .2)}
.tag.on i{background:#fff}
.tag.has{opacity:.55}
.tile.add,.tag.add{background:transparent;border:2px dashed rgb(255 255 255 / .25);box-shadow:none;color:var(--dim)}
.editing .add,.editing .add-genre{display:none}
.editing .tile:not(.add),.editing .tag:not(.add){animation:wig .3s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
.x{position:absolute;top:-5px;right:-5px;width:24px;height:24px;border-radius:50%;background:#ff4d6d;color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px rgb(0 0 0 / .4);z-index:2}
.newrow{display:flex;gap:8px;margin-top:4px}
.newrow input{flex:1;min-width:0;height:48px;border-radius:14px;border:2px solid rgb(255 255 255 / .2);background:rgb(0 0 0 / .25);color:#fff;padding:0 12px}
.add-genre{margin-top:14px;min-height:48px;border-radius:14px;border:2px dashed rgb(255 255 255 / .25);color:var(--dim);font-weight:800;font-size:.9rem}
.gform{display:grid;gap:8px;margin-top:10px;background:rgb(0 0 0 / .25);border-radius:16px;padding:10px}
.gcolors{display:flex;gap:6px;flex-wrap:wrap}
.gcolors button{width:34px;height:34px;border-radius:10px;background:var(--cc);box-shadow:inset 0 2px 0 rgb(255 255 255 / .35),inset 0 -3px 0 rgb(0 0 0 / .25)}
.gcolors button.on{outline:3px solid #fff;outline-offset:2px}
.colrow{display:grid;gap:8px}
.colrow>span{font-size:.75rem;font-weight:800;color:var(--dim)}
.colpick{position:relative;width:34px;height:34px;border-radius:10px;background:conic-gradient(#ff5d7a,#ffb627,#84cc16,#2fd69a,#38bdf8,#6366f1,#c084fc,#ff5d7a);display:grid;place-items:center;font-weight:800;font-size:1rem;color:#fff;text-shadow:0 1px 2px rgb(0 0 0 / .5);overflow:hidden}
.colpick.on{outline:3px solid #fff;outline-offset:2px}
.colpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}

/* ② 置く */
.zoom{display:flex;background:rgb(0 0 0 / .3);border-radius:12px;padding:3px;gap:2px}
.zoom button{width:38px;height:36px;border-radius:9px;font-weight:800;font-size:1.15rem}
.zoom button:disabled{opacity:.3}
.tools{display:flex;gap:6px;flex:none}
.tools button{flex:1;min-height:38px;border-radius:12px;background:rgb(255 255 255 / .1);font-size:.8rem;font-weight:800}
.split{flex:1;min-height:0;display:grid;grid-template-columns:78px 1fr 34px;gap:6px}
.mini{position:relative;border-radius:14px;background:rgb(0 0 0 / .3);touch-action:none;cursor:ns-resize;overflow:hidden}
.mini .ms{position:absolute;left:5px;right:5px;border-radius:2px;opacity:.85}
.mini .mh{position:absolute;left:0;right:0;border-top:1px solid rgb(255 255 255 / .08)}
.mini .mt{position:absolute;left:0;right:0;font-family:var(--mono);font-size:8px;color:rgb(255 255 255 / .45);text-align:center;transform:translateY(-50%)}
.mini .thumb{position:absolute;left:1px;right:1px;border-radius:10px;border:2px solid var(--gold1);background:rgb(255 210 63 / .12);pointer-events:none;min-height:24px}
.mini .grip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;gap:3px;pointer-events:none}
.mini .grip i{display:block;width:12px;height:2px;border-radius:1px;background:var(--gold1)}
.tray{border-radius:16px;background:rgb(0 0 0 / .28);padding:6px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;scrollbar-width:none;min-height:0}
.tray::-webkit-scrollbar{display:none}
.tray.drop{box-shadow:inset 0 0 0 2px var(--gold1)}
.chip{min-height:46px;border-radius:11px;padding:6px 7px;font-weight:800;font-size:.78rem;word-break:break-all;display:flex;flex-direction:column;justify-content:center;touch-action:pan-y;cursor:grab;line-height:1.25;flex:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .15s,filter .15s}
.chip small{font-family:var(--mono);font-size:9px;font-weight:500;opacity:.85}
.chip.free{background:transparent;border:2px dashed rgb(255 255 255 / .3);box-shadow:none;color:var(--dim);text-shadow:none}
.chip.more{background:rgb(255 255 255 / .1);box-shadow:none;text-shadow:none;align-items:center;font-size:.74rem;color:var(--dim);touch-action:auto;cursor:pointer;min-height:44px}
.tray-empty{font-size:.76rem;color:var(--dim);text-align:center;padding:6px 2px}
.bscroll{border-radius:18px;background:var(--well);box-shadow:inset 0 0 0 2px rgb(255 255 255 / .06);position:relative;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;scrollbar-width:none;min-height:0;overscroll-behavior:contain}
.bscroll::-webkit-scrollbar{display:none}
.track{position:relative}
.ln{position:absolute;left:40px;right:4px;border-top:1px solid rgb(255 255 255 / .1);pointer-events:none}
.ln.half{border-top:1px dashed rgb(255 255 255 / .05)}
.lab{position:absolute;left:2px;width:32px;text-align:right;font-family:var(--mono);font-size:10px;color:rgb(255 255 255 / .55);transform:translateY(-50%);pointer-events:none}
.nowl{position:absolute;left:36px;right:0;height:2px;background:var(--now);pointer-events:none;z-index:1}
.blk{position:absolute;left:44px;right:6px;border-radius:10px;touch-action:pan-y;cursor:grab;transition:top .14s ease,height .14s ease,transform .15s,filter .15s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.blk.hold,.chip.hold{transform:scale(1.05);filter:brightness(1.15);z-index:4}
.hd.hold::after{background:var(--gold1);transform:scale(1.25)}
.blk .in{position:absolute;inset:0;border-radius:inherit;overflow:hidden;display:flex;flex-direction:column;padding:5px 9px;line-height:1.25;font-weight:800;font-size:.86rem}
.blk .in small{font-family:var(--mono);font-size:10px;font-weight:500;opacity:.85}
.blk.mid .in{flex-direction:row;align-items:center;gap:6px;padding:0 9px;font-size:.78rem;white-space:nowrap}
.blk.tiny .in{flex-direction:row;align-items:center;gap:6px;padding:0 8px;font-size:.66rem;white-space:nowrap}
.blk.tiny .in small{font-size:9px}
.blk.free{background:repeating-linear-gradient(135deg,rgb(255 255 255 / .1) 0 8px,rgb(255 255 255 / .05) 8px 16px);box-shadow:inset 0 0 0 2px rgb(255 255 255 / .2);color:var(--dim);text-shadow:none}
.blk.ghost{background:rgb(255 255 255 / .1)!important;box-shadow:inset 0 0 0 2px rgb(255 255 255 / .65)!important;color:transparent;text-shadow:none}
.blk.ghost.bad{box-shadow:inset 0 0 0 2px var(--bad)!important;background:rgb(255 77 77 / .2)!important}
.blk.lifted{opacity:.25}
.blk.pushed .in{outline:2px solid rgb(255 255 255 / .5);outline-offset:-2px}
.blk.pop{animation:pop .34s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.hd{position:absolute;left:50%;transform:translateX(-50%);bottom:-11px;width:64px;height:22px;touch-action:pan-y;cursor:ns-resize;z-index:3;display:grid;place-items:center}
.hd::after{content:"";width:34px;height:6px;border-radius:3px;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .4)}
.bubble{position:fixed;z-index:60;background:#fff;color:#1d1a4a;font-family:var(--mono);font-weight:800;font-size:12px;border-radius:9px;padding:3px 9px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 12px rgb(0 0 0 / .3)}
.float{position:fixed;z-index:50;pointer-events:none;border-radius:10px;font-weight:800;font-size:.86rem;padding:5px 9px;transform:rotate(-2deg) scale(1.04);box-shadow:inset 0 3px 0 rgb(255 255 255 / .35),inset 0 -5px 0 rgb(0 0 0 / .22),0 18px 30px rgb(0 0 0 / .45)!important;display:flex;flex-direction:column;line-height:1.25;overflow:hidden}
.float small{font-family:var(--mono);font-size:10px;font-weight:500;opacity:.85}

/* 見る */
.ag{display:flex;align-items:stretch;gap:12px;border-radius:18px;background:rgb(0 0 0 / .25);padding:12px 14px;min-height:60px;width:100%;text-align:left}
.ag .t{width:56px;flex:none;font-family:var(--mono);font-size:1rem;line-height:1.2}
.ag .t small{display:block;font-size:.72rem;color:var(--dim)}
.ag .bar{width:6px;border-radius:3px;background:var(--cc);box-shadow:inset 0 2px 0 rgb(255 255 255 / .35);flex:none}
.ag b{font-weight:800;display:block}
.ag span.m{display:block;font-size:.75rem;color:var(--dim)}
.ag.now{box-shadow:0 0 0 2px var(--now)}
.ag.past{opacity:.5}
.list{display:grid;gap:8px;padding-bottom:6px}

/* 送る */
.segm{display:grid;grid-template-columns:1fr 1fr;background:rgb(0 0 0 / .3);border-radius:14px;padding:3px;gap:3px;flex:none}
.segm button{min-height:42px;border-radius:11px;font-weight:800;color:var(--dim)}
.segm button.on{background:var(--deep);color:#fff}
.preview{border-radius:16px;overflow:hidden;background:#fff}
.preview img{display:block;width:100%;height:auto;-webkit-touch-callout:default;user-select:auto}
.hint{font-size:.75rem;color:var(--dim);text-align:center;margin:0}
.full{position:fixed;inset:0;z-index:80;background:#fff;overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.full img{display:block;width:100%;height:auto}
.full button{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;min-height:40px;padding:0 14px;border-radius:12px;background:rgb(20 18 54 / .85);color:#fff;font-weight:800}

/* 下から出るパネル */
.scrim{position:fixed;inset:0;background:rgb(5 4 20 / .55);z-index:20}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:21;background:var(--deep2);border-radius:24px 24px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;box-shadow:0 -10px 30px rgb(0 0 0 / .4);max-height:90vh;overflow-y:auto}
.sheet h2{margin:0;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.sheet h2 i{width:16px;height:16px;border-radius:5px;background:var(--cc)}
.st{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.st span{font-size:.75rem;font-weight:800;color:var(--dim);grid-column:1/-1;margin-bottom:-6px}
.st button{width:56px;height:48px;border-radius:14px;background:var(--deep);font-weight:800;font-size:1.2rem;box-shadow:inset 0 -4px 0 rgb(0 0 0 / .25)}
.st b{text-align:center;font-family:var(--mono);font-size:1.25rem}
.sheet .r2{display:flex;gap:8px}
.sheet .r2>button{flex:1}
.del-btn{background:#5a1d3a!important;color:#ffb3c7}
.field{display:grid;gap:6px}
.field label{font-size:.75rem;font-weight:800;color:var(--dim)}
.field input{height:50px;border-radius:14px;border:2px solid rgb(255 255 255 / .2);background:rgb(0 0 0 / .25);color:#fff;padding:0 14px}
.setlist{display:grid;gap:8px}
.setlist button{min-height:54px;border-radius:16px;background:rgb(0 0 0 / .25);text-align:left;padding:0 16px;font-weight:800}

/* その場で案内 */
.coach{position:fixed;inset:0;z-index:40}
.coach .hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgb(5 4 20 / .72);outline:3px solid var(--gold1);pointer-events:none}
.coach .tip{position:fixed;background:#fff;color:#1d1a4a;border-radius:16px;padding:12px 14px;font-weight:800;font-size:.92rem;max-width:260px;line-height:1.5}
.coach .tip .r{display:flex;gap:8px;margin-top:8px;align-items:center}
.coach .tip button{border-radius:10px;padding:7px 14px;font-weight:800;font-size:.82rem}
.coach .tip .skip{color:#6b6790;padding:7px 4px}
.finger{position:fixed;width:34px;height:34px;border-radius:50%;background:rgb(255 255 255 / .5);border:3px solid #fff;z-index:41;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.finger{animation:fing 1.8s ease-in-out infinite}@keyframes fing{0%{transform:translate(0,0)}60%,100%{transform:translate(var(--fx),var(--fy))}}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:#fff;color:#1d1a4a;font-weight:800;border-radius:999px;padding:10px 18px;font-size:.88rem;box-shadow:0 8px 20px rgb(0 0 0 / .35);max-width:calc(100vw - 32px);text-align:center}
.toast button{margin-left:10px;color:#4b3cf0;font-weight:800;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.blk{transition:none}.blk.pop{animation:none}.editing .tile,.editing .tag{animation:none}}
</style>
</head>
<body>

<div class="app" id="app"></div>
<div id="sheetRoot"></div>
<div id="overRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
  'use strict';
  const KEY='mainichi-yotei-v2';
  const WD='日月火水木金土';
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pad=n=>String(n).padStart(2,'0');
  const hm=m=>Math.floor(m/60)+':'+pad(m%60);
  const len=m=>(m>=60?Math.floor(m/60)+'時間':'')+(m%60?(m%60)+'分':'');
  const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
  const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
  const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes();};
  const md=d=>(d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）';
  const sd=d=>(d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）';
  const uid=()=>Math.random().toString(36).slice(2,10);
  function buzz(){try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}}
  const ICON={
    back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    gear:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>'
  };

  // ===== 保存 =====
  const GPAL=['#38bdf8','#f472b6','#34d399','#fbbf24','#a78bfa','#fb923c','#f87171','#2dd4bf'];
  const BPAL=['#ff5d7a','#ff8a3d','#ffb627','#84cc16','#2fd69a','#22c3b5','#38bdf8','#6366f1','#a26bff','#e879f9','#ff7eb6','#94a3b8'];
  // ブロックの色を変える：その種類（例「宿題」）の色を、選ぶ画面・手持ち・どの日のブロックもまとめて変える
  function setKindColor(pid,col){
    const p=S.presets.find(x=>x.id===pid); if(p) p.c=col;
    Object.values(S.days).forEach(d=>{ d.blocks.forEach(b=>{ if(b.pid===pid&&!b.free) b.c=col; }); d.tray.forEach(t=>{ if(t.pid===pid) t.c=col; }); });
    save();
  }
  function defaults(){
    return {name:'',view:'tile',zoom:2,tut:{pick:false,board:false},sent:{},days:{},
      genres:[{id:'school',n:'学校・勉強',c:'#2fd69a'},{id:'life',n:'生活',c:'#ffb627'},{id:'free',n:'自由',c:'#c084fc'},{id:'other',n:'そのほか',c:'#94a3b8'}],
      presets:[
        {id:'school',g:'school',n:'学校',c:'#2fd69a',d:420,use:0},{id:'club',g:'school',n:'部活',c:'#ff8a3d',d:120,use:0},{id:'hw',g:'school',n:'宿題',c:'#ff5d7a',d:60,use:0},
        {id:'study',g:'school',n:'勉強',c:'#38bdf8',d:60,use:0},{id:'juku',g:'school',n:'塾',c:'#a26bff',d:90,use:0},{id:'lesson',g:'school',n:'習いごと',c:'#22c3b5',d:60,use:0},
        {id:'sleep',g:'life',n:'睡眠',c:'#6366f1',d:420,use:0},{id:'dinner',g:'life',n:'夕ごはん',c:'#ffb627',d:45,use:0},{id:'bath',g:'life',n:'おふろ',c:'#ff7eb6',d:30,use:0},
        {id:'breakfast',g:'life',n:'朝ごはん',c:'#f59e0b',d:30,use:0},{id:'ready',g:'life',n:'身じたく',c:'#fb7185',d:30,use:0},{id:'help',g:'life',n:'家の手伝い',c:'#84cc16',d:30,use:0},
        {id:'freetime',g:'free',n:'自由時間',c:'#a78bfa',d:60,use:0},{id:'phone',g:'free',n:'スマホ',c:'#c084fc',d:30,use:0},{id:'game',g:'free',n:'ゲーム',c:'#e879f9',d:60,use:0},
        {id:'friends',g:'free',n:'友だちと',c:'#f472b6',d:120,use:0},
        {id:'move',g:'other',n:'移動',c:'#94a3b8',d:30,use:0},{id:'job',g:'other',n:'バイト',c:'#64748b',d:240,use:0}
      ]};
  }
  let S;
  try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){ S=null; }
  if(!S||!S.presets) S=defaults();
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
  const dayOf=k=>S.days[k]||(S.days[k]={blocks:[],tray:[]});
  const hasPlan=k=>{const d=S.days[k];return !!(d&&(d.blocks.length||d.tray.length));};

  // ===== 画面の切りかえ =====
  let screen='home', homeDay=today(), cur=today(), backTo='home';
  function go(s,opt={}){ closeSheet(); $('overRoot').innerHTML=''; if(opt.date) cur=opt.date; if(opt.back) backTo=opt.back; screen=s; render(); }
  function render(){ ({home:renderHome,pick:renderPick,board:renderBoard,view:renderView,send:renderSend,settings:renderSettings})[screen](); }
  function toast(t,undo){ $('toastRoot').innerHTML='<div class="toast" role="status">'+esc(t)+(undo?'<button data-undo>もどす</button>':'')+'</div>'; clearTimeout(toast.t); toast.t=setTimeout(()=>{$('toastRoot').innerHTML='';toast.undo=null;},undo?4000:2000); toast.undo=undo||null; }
  $('toastRoot').onclick=e=>{ if(e.target.closest('[data-undo]')&&toast.undo){ toast.undo(); toast.undo=null; $('toastRoot').innerHTML=''; } };
  function openSheet(html,onClick){ $('sheetRoot').innerHTML='<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true">'+html+'</div>'; $('sheetRoot').onclick=e=>{ if(e.target.closest('[data-close]')){closeSheet();return;} onClick&&onClick(e); }; }
  function closeSheet(){ $('sheetRoot').innerHTML=''; }
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); $('overRoot').innerHTML=''; } });
  const dayWord=d=>{const k=keyOf(d),t=today();return k===keyOf(t)?'今日':k===keyOf(addDays(t,1))?'明日':sd(d);};
  function startMake(d){ cur=d; go(hasPlan(keyOf(d))?'board':'pick',{date:d}); }

  // ===== ホーム =====
  function tallBar(list,isToday){
    const nm=nowMin(); let h='<div class="hbar"><div class="hb">';
    list.forEach(b=>{ const c=isToday&&nm>=b.s&&nm<b.s+b.d;
      h+='<div class="seg '+(b.free?'free':'glossy')+(c?' cur':'')+'" style="--cc:'+b.c+';left:'+(b.s/1440*100)+'%;width:'+(b.d/1440*100)+'%"><span class="vt">'+(b.d>=40?esc(b.n):'')+'</span></div>'; });
    for(let t=3;t<24;t+=3) h+='<i class="gl" style="left:'+(t/24*100)+'%"></i>';
    if(isToday) h+='<span class="hnow" style="left:'+(nm/1440*100)+'%"></span>';
    h+='</div><div class="hticks">'; for(let t=0;t<=24;t+=3) h+='<span style="left:'+(t/24*100)+'%">'+t+'</span>';
    return h+'</div></div>';
  }
  function renderHome(){
    const t=today(), k=keyOf(homeDay), isToday=k===keyOf(t), list=dayOf(k).blocks.slice().sort((a,b)=>a.s-b.s), nm=nowMin();
    const curB=isToday?list.find(b=>nm>=b.s&&nm<b.s+b.d):null, nx=isToday?list.find(b=>b.s>nm):null;
    const mon=mondayOf(homeDay), tm=addDays(t,1), tmk=keyOf(tm);
    const night=isToday&&nm>=20*60;
    $('app').innerHTML='<div class="scr">'
      +'<div class="row"><div class="grow"><div class="sub">'+(homeDay.getMonth()+1)+'月'+(S.name?'・'+esc(S.name):'')+'</div><div class="ttl">'+homeDay.getDate()+'日（'+WD[homeDay.getDay()]+'）'+(isToday?'':'')+'</div></div>'
      +(isToday?'':'<button class="sm-btn deep" data-today>今日</button>')+'<button class="icon" data-go="settings" aria-label="設定">'+ICON.gear+'</button></div>'
      +'<div class="week">'+[...Array(7)].map((_,i)=>{const d=addDays(mon,i),dk=keyOf(d);return '<button data-day="'+dk+'" class="'+(dk===k?'on ':'')+(dk===keyOf(t)?'today':'')+'" aria-label="'+md(d)+'"><span class="w">'+(dk===keyOf(t)?'今日':WD[d.getDay()])+'</span><span class="n">'+d.getDate()+'</span><span class="mk">'+(S.sent[dk]?'送✓':hasPlan(dk)?'●':'')+'</span></button>';}).join('')+'</div>'
      +(night?(hasPlan(tmk)
          ?'<div class="night ok"><span class="moon"></span><div class="grow"><b>明日の計画はできてるよ</b><p>'+md(tm)+'</p></div><button class="sm-btn deep" data-send="'+tmk+'">送る</button></div>'
          :'<div class="night"><span class="moon"></span><div class="grow"><b>明日の計画をつくろう</b><p>'+md(tm)+'はまだです</p></div><button class="sm-btn gold" data-make="'+tmk+'">つくる</button></div>'):'')
      +'<div class="card">'+(list.length
          ?(isToday&&(curB||nx)?'<div class="nowbox">'+(curB?'<span class="lb">いま</span><span><b>'+esc(curB.n)+'</b> <span class="tm">〜'+hm(curB.s+curB.d)+'</span></span>':'')+(nx?'<span class="lb nx">つぎ</span><span><b>'+esc(nx.n)+'</b> <span class="tm">'+hm(nx.s)+'〜</span></span>':'')+'</div>':'')+tallBar(list,isToday)
          :'<div class="empty">'+(hasPlan(k)?'ブロックがまだ置かれていません':'まだ計画がありません')+'</div>')+'</div>'
      +'<div style="display:grid;gap:8px;flex:none"><button class="big-btn gold" data-make="'+k+'">'+(hasPlan(k)?'計画をなおす':'計画をつくる')+'</button>'
      +'<div class="acts"><button class="big-btn deep" data-view="'+k+'">見る</button><button class="big-btn deep" data-send="'+k+'">親に送る'+(S.sent[k]?' ✓':'')+'</button></div></div></div>';
    $('app').onclick=e=>{ let el;
      if(el=e.target.closest('[data-day]')){ homeDay=fromKey(el.dataset.day); renderHome(); return; }
      if(e.target.closest('[data-today]')){ homeDay=today(); renderHome(); return; }
      if(el=e.target.closest('[data-make]')){ backTo='home'; startMake(fromKey(el.dataset.make)); return; }
      if(el=e.target.closest('[data-view]')){ go('view',{date:fromKey(el.dataset.view),back:'home'}); return; }
      if(el=e.target.closest('[data-send]')){ go('send',{date:fromKey(el.dataset.send),back:'home'}); return; }
      if(el=e.target.closest('[data-go]')) go(el.dataset.go);
    };
  }
  setInterval(()=>{ if(screen==='home'&&!$('sheetRoot').innerHTML) renderHome(); },60000);

  // ===== ホーム画面に追加 =====
  let installEv=null;
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEv=e; });
  const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  function addToHome(){
    if(installEv){ const ev=installEv; installEv=null; ev.prompt(); ev.userChoice.then(r=>{ if(r.outcome==='accepted') toast('ホーム画面に追加しました'); }).catch(()=>{}); return; }
    const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    const steps=ios
      ?['Safari で開く','下の <b>共有ボタン</b>（四角から矢印が出ているマーク）をタップ','<b>「ホーム画面に追加」</b>をえらぶ','右上の <b>「追加」</b>をタップ']
      :['Chrome で開く','右上の <b>︙</b>（点が3つ）をタップ','<b>「ホーム画面に追加」</b>または<b>「アプリをインストール」</b>をえらぶ','<b>「追加」</b>をタップ'];
    openSheet('<h2>ホーム画面に追加する</h2><div style="display:flex;gap:12px;align-items:center"><img src="icon-192.png" alt="" width="56" height="56" style="border-radius:14px"><p style="margin:0;font-size:.9rem;color:var(--dim)">追加すると、アイコンからアプリのように開けます。電波がなくても使えます。</p></div>'
      +'<ol style="margin:0;padding-left:1.4em;display:grid;gap:8px;line-height:1.5">'+steps.map(t=>'<li>'+t+'</li>').join('')+'</ol>'
      +'<button class="big-btn gold" data-close>わかった</button>');
  }

  // ===== 設定 =====
  function renderSettings(){
    $('app').innerHTML='<div class="scr"><div class="row"><button class="icon" data-back aria-label="もどる">'+ICON.back+'</button><div class="grow ttl" style="font-size:1.15rem">設定</div></div>'
      +'<div class="field"><label for="nameIn">名前（親に送る画像に入ります）</label><input id="nameIn" maxlength="20" placeholder="例：はな" value="'+esc(S.name)+'" autocomplete="off"></div>'
      +'<div class="setlist">'+(standalone()?'':'<button data-a2hs>ホーム画面に追加する</button>')+'<button data-tut>使い方の案内をもう一度見る</button><button data-reset style="color:#ffb3c7">データをすべて消す</button></div><div id="resetBox"></div></div>';
    $('nameIn').oninput=e=>{S.name=e.target.value.trim();save();};
    $('app').onclick=e=>{
      if(e.target.closest('[data-back]')){ go('home'); return; }
      if(e.target.closest('[data-a2hs]')){ addToHome(); return; }
      if(e.target.closest('[data-tut]')){ S.tut={pick:false,board:false}; save(); toast('次に計画をつくるとき、案内が出ます'); return; }
      if(e.target.closest('[data-reset]')){ $('resetBox').innerHTML='<div class="night" style="box-shadow:0 0 0 2px #ff4d6d;background:#3a1530"><div class="grow"><b>ほんとうに全部消しますか？</b><p>予定・作ったブロック・名前が消えます</p></div><button class="sm-btn del-btn" data-reset2>消す</button></div>'; return; }
      if(e.target.closest('[data-reset2]')){ S=defaults(); save(); homeDay=today(); go('home'); toast('すべて消しました'); }
    };
  }

  // ===== ① 選ぶ =====
  let chosen=new Set(), editing=false, addOpen=false, genreOpen=false, gColor=GPAL[0];
  function renderPick(){
    const k=keyOf(cur), day=dayOf(k), already=new Set(day.blocks.map(b=>b.pid).concat(day.tray.map(t=>t.pid)));
    const X=editing?'<span class="x" aria-hidden="true">×</span>':'';
    const item=p=>{ const on=chosen.has(p.id)&&!editing, has=already.has(p.id)&&!editing&&!on;
      return S.view==='tile'
        ? '<button class="tile'+(on?' on':'')+(has?' has':'')+'" data-pk="'+p.id+'" style="--cc:'+p.c+'" aria-pressed="'+on+'"><span class="ic"></span>'+esc(p.n)+(on?'<span class="ck">✓</span>':'')+X+'</button>'
        : '<button class="tag'+(on?' on':'')+(has?' has':'')+'" data-pk="'+p.id+'" style="--cc:'+p.c+'" aria-pressed="'+on+'"><i></i>'+esc(p.n)+X+'</button>'; };
    let body='';
    S.genres.forEach(g=>{
      const list=S.presets.filter(p=>p.g===g.id).sort((a,b)=>b.use-a.use);
      body+='<div class="genre" style="--gc:'+g.c+'"><i></i>'+esc(g.n)+(editing?'<button class="gx" data-delgenre="'+g.id+'">ジャンルごと消す</button>':'')+'</div>'
        +'<div class="'+(S.view==='tile'?'tiles':'tags')+'">'+list.map(item).join('')+(S.view==='tile'?'<button class="tile add" data-addnew="'+g.id+'">＋ 作る</button>':'<button class="tag add" data-addnew="'+g.id+'">＋ 作る</button>')+'</div>'
        +(addOpen===g.id?'<form class="newrow" id="newForm"><input id="newIn" maxlength="12" placeholder="'+esc(g.n)+'の予定を作る" autocomplete="off"><button class="sm-btn deep" type="submit">追加</button></form>':'');
    });
    body+=genreOpen
      ?'<form class="gform" id="gForm"><div class="newrow" style="margin:0"><input id="gIn" maxlength="10" placeholder="ジャンルの名前（例：受験）" autocomplete="off"><button class="sm-btn deep" type="submit">作る</button></div><div class="gcolors">'+GPAL.map(c=>'<button type="button" data-gcol="'+c+'" class="'+(c===gColor?'on':'')+'" style="--cc:'+c+'" aria-label="色"></button>').join('')+'</div></form>'
      :'<button class="add-genre" data-addgenre>＋ ジャンルを作る</button>';
    const sc=$('pickScroll')?$('pickScroll').scrollTop:0;
    $('app').innerHTML='<div class="scr"><div class="row"><button class="icon" data-back aria-label="もどる">'+ICON.back+'</button><div class="grow ttl" style="font-size:1.2rem">'+dayWord(cur)+'のやることは？</div>'
      +'<button class="sm-btn gold" data-fin'+(chosen.size?'':' disabled style="filter:grayscale(.85);opacity:.45"')+'>'+(chosen.size?chosen.size+'こで決定':'決定')+'</button></div>'
      +'<div class="row" style="justify-content:space-between;margin-top:-4px"><button class="edit-btn'+(editing?' on':'')+'" data-edit>'+(editing?'消すのをおわる':'へんしゅう')+'</button><div class="mini-seg"><button data-v="tile" class="'+(S.view==='tile'?'on':'')+'">タイル</button><button data-v="tag" class="'+(S.view==='tag'?'on':'')+'">タグ</button></div></div>'
      +'<div class="scroll"><div class="pick-list'+(editing?' editing':'')+'">'+body+'</div></div></div>';
    const scEl=$('app').querySelector('.scroll'); scEl.id='pickScroll'; scEl.scrollTop=sc;
    const gf=$('gForm'); if(gf){ $('gIn').focus(); gf.onsubmit=e=>{e.preventDefault(); const v=$('gIn').value.trim(); if(!v) return; const id='g'+uid(); S.genres.push({id,n:v,c:gColor}); save(); genreOpen=false; addOpen=id; renderPick(); $('pickScroll').scrollTop=1e5; toast('「'+v+'」を作りました');}; }
    const f=$('newForm'); if(f){ $('newIn').focus(); f.onsubmit=e=>{e.preventDefault(); const v=$('newIn').value.trim(); if(!v) return; const g=S.genres.find(x=>x.id===addOpen); const id='c'+uid();
      const same=S.presets.filter(p=>p.g===g.id).length; const cols=[g.c,'color-mix(in srgb,'+g.c+' 70%,#fff)','color-mix(in srgb,'+g.c+' 70%,#000)'];
      S.presets.push({id,g:g.id,n:v,c:cols[same%3],d:60,use:0}); chosen.add(id); save(); addOpen=false; renderPick();}; }
    $('app').onclick=e=>{ let el;
      if(e.target.closest('[data-back]')){ chosen.clear(); editing=false; go(hasPlan(keyOf(cur))&&backTo==='board'?'board':backTo==='board'?'home':backTo); return; }
      if(el=e.target.closest('[data-v]')){ S.view=el.dataset.v; save(); renderPick(); return; }
      if(e.target.closest('[data-edit]')){ editing=!editing; addOpen=false; genreOpen=false; renderPick(); return; }
      if(e.target.closest('[data-addgenre]')){ genreOpen=true; addOpen=false; gColor=GPAL[S.genres.length%GPAL.length]; renderPick(); $('pickScroll').scrollTop=1e5; return; }
      if(el=e.target.closest('[data-gcol]')){ gColor=el.dataset.gcol; const v=$('gIn').value; renderPick(); $('gIn').value=v; return; }
      if(el=e.target.closest('[data-addnew]')){ addOpen=addOpen===el.dataset.addnew?false:el.dataset.addnew; genreOpen=false; renderPick(); return; }

  function insertAt(list,item,s,snap){

        if(el.dataset.tool==='pack'){ let end=arr[0].s; D.blocks=arr.map(b=>{const c={...b,s:end}; end+=b.d; return c;}); toast('すきまをつめました',()=>{D.blocks=JSON.parse(before);commit();if(screen==='board')draw();}); }
        else { const add=[]; for(let i=1;i<arr.length;i++){ const gap=arr[i].s-(arr[i-1].s+arr[i-1].d); if(gap>0) add.push({id:'f'+uid(),...FREE,s:arr[i-1].s+arr[i-1].d,d:gap}); }
          D.blocks=arr.concat(add); if(add.length) toast('すきまを自由時間にしました',()=>{D.blocks=JSON.parse(before);commit();if(screen==='board')draw();}); else toast('すきまはありません'); }
        commit(); buzz(); draw();
      }
    };
    if(!S.tut.board) setTimeout(()=>coach([
      {sel:'#tray .chip',msg:'手持ちのブロックを<b>長押し</b>して、右の時間表へドラッグしてね',fx:150,fy:40},
      {sel:'#tray .chip',msg:'タップするだけでも、いちばん後ろにくっついて置けるよ',fx:0,fy:0},
      {sel:'#bs',msg:'置いたブロックも長押しで動かせるよ。下のつまみを長押しして引くと長さが変わるよ。タップすると色や時間を直せるよ',fx:0,fy:30},
      {sel:'#mini',msg:'右のバーをなぞると、時間表を上下に動かせるよ',fx:0,fy:80},
      {sel:'.zoom',msg:'＋−で時間表を大きく・小さくできるよ',fx:0,fy:0}
    ],()=>{S.tut.board=true;save();}),300);
  }
  window.addEventListener('pointerdown',e=>{ if(screen==='board'&&board) board.down(e); },{passive:false});
  window.addEventListener('pointermove',e=>{ if(screen==='board'&&board) board.move(e); });
  window.addEventListener('pointerup',e=>{ if(screen==='board'&&board) board.up(e); });
  window.addEventListener('pointercancel',()=>{ if(screen==='board'&&board) board.cancel(); });
  // 持ち上げている間は、画面がスクロールしないように
  // （持ち上げた時に描き直すと指の下の部品が消えて window まで届かないので、触った部品そのものにも付ける）
  const stopScroll=e=>{ if(screen==='board'&&board&&board.dragging()) e.preventDefault(); };
  window.addEventListener('touchmove',stopScroll,{passive:false});
  window.addEventListener('touchstart',e=>{ if(screen!=='board') return; const t=e.target;
    const off=()=>{ t.removeEventListener('touchmove',stopScroll); t.removeEventListener('touchend',off); t.removeEventListener('touchcancel',off); };
    t.addEventListener('touchmove',stopScroll,{passive:false}); t.addEventListener('touchend',off); t.addEventListener('touchcancel',off); },{passive:true});
  window.addEventListener('contextmenu',e=>{ if(screen==='board'&&e.target.closest('.blk,.chip')) e.preventDefault(); });

  // ===== 見る（リスト） =====
  function renderView(){
    const k=keyOf(cur), t=today(), isToday=k===keyOf(t), list=dayOf(k).blocks.slice().sort((a,b)=>a.s-b.s), nm=nowMin(), mon=mondayOf(cur), tray=dayOf(k).tray;
    $('app').innerHTML='<div class="scr"><div class="row"><button class="icon" data-back aria-label="もどる">'+ICON.back+'</button><div class="grow ttl" style="font-size:1.15rem">'+md(cur)+'</div><button class="sm-btn deep" data-send>送る</button></div>'
      +'<div class="week">'+[...Array(7)].map((_,i)=>{const d=addDays(mon,i),dk=keyOf(d);return '<button data-day="'+dk+'" class="'+(dk===k?'on ':'')+(dk===keyOf(t)?'today':'')+'"><span class="w">'+(dk===keyOf(t)?'今日':WD[d.getDay()])+'</span><span class="n">'+d.getDate()+'</span><span class="mk">'+(S.sent[dk]?'送✓':hasPlan(dk)?'●':'')+'</span></button>';}).join('')+'</div>'
      +'<div class="scroll"><div class="list">'+(list.length?list.map(b=>{const on=isToday&&nm>=b.s&&nm<b.s+b.d, past=isToday&&nm>=b.s+b.d;
          return '<button class="ag'+(on?' now':'')+(past?' past':'')+'" data-edit style="--cc:'+b.c+'"><div class="t">'+hm(b.s)+'<small>〜'+hm(b.s+b.d)+'</small></div><span class="bar"></span><div class="grow"><b>'+esc(b.n)+'</b><span class="m">'+len(b.d)+(on?'・いまここ':'')+'</span></div></button>';}).join('')
        :'<div class="empty">'+md(cur)+'の計画はまだありません</div>')
      +(tray.length?'<div class="sub" style="margin-top:8px">時間をまだ決めていない</div>'+tray.map(x=>'<div class="ag" style="--cc:'+x.c+'"><div class="t" style="color:var(--dim)">--:--</div><span class="bar"></span><div class="grow"><b>'+esc(x.n)+'</b><span class="m">'+len(x.d)+'</span></div></div>').join(''):'')
      +'</div></div><button class="big-btn gold" style="flex:none" data-make>'+(hasPlan(k)?'計画をなおす':'計画をつくる')+'</button></div>';
    requestAnimationFrame(()=>{const n=$('app').querySelector('.ag.now'); if(n) n.scrollIntoView({block:'center'});});
    $('app').onclick=e=>{ let el;
      if(e.target.closest('[data-back]')){ go('home'); return; }
      if(el=e.target.closest('[data-day]')){ cur=fromKey(el.dataset.day); renderView(); return; }
      if(e.target.closest('[data-send]')){ go('send',{back:'view'}); return; }
      if(e.target.closest('[data-make]')||e.target.closest('[data-edit]')){ backTo='view'; startMake(cur); }
    };
  }

  // ===== 送る（白い手帳の画像） =====
  let sendKind='day';
  const IF=(w,s)=>w+' '+s+'px "M PLUS Rounded 1c","Hiragino Sans","Yu Gothic",sans-serif';
  const IM=s=>'500 '+s+'px "DM Mono",ui-monospace,monospace';
  function rr(c,x,y,w,h,r){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h);}
  function fit(c,t,maxW){ if(c.measureText(t).width<=maxW) return t; while(t&&c.measureText(t+'…').width>maxW) t=t.slice(0,-1); return t+'…'; }
  function solid(col){ // color-mix の色を画像用のふつうの色に
    if(!/color-mix/.test(col)) return col;
    const m=col.match(/(#[0-9a-f]{6}) 70%,#(fff|000)/i); if(!m) return '#888888';
    const h=m[1], t=m[2].toLowerCase()==='fff'?255:0, f=x=>Math.round(parseInt(h.substr(x,2),16)*.7+t*.3).toString(16).padStart(2,'0');
    return '#'+f(1)+f(3)+f(5);
  }
  function hourRange(items){ const pl=items.filter(b=>!(b.pid==='sleep'&&(b.s===0||b.s+b.d===1440))); if(!pl.length) return items.length?[0,24]:[7,23];
    let a=Math.floor(Math.min(...pl.map(b=>b.s))/60), b=Math.ceil(Math.max(...pl.map(b=>b.s+b.d))/60); if(b-a<4){b=Math.min(24,a+4);a=Math.max(0,b-4);} return [a,b]; }
  function noteBlock(c,x,y,w,h,col){ col=solid(col); c.save(); rr(c,x,y,w,h,Math.min(14,h/2)); c.clip(); c.fillStyle=col+'33'; c.fillRect(x,y,w,h); c.fillStyle=col; c.fillRect(x,y,8,h); c.restore(); }
  function imgHeader(c,title,sub){ c.fillStyle='#1b2430'; c.font=IF(800,50); c.fillText(title,60,98); c.fillStyle='#5f6878'; c.font=IF(800,28); c.fillText(sub,60,144); }
  function drawDay(){
    const k=keyOf(cur), list=dayOf(k).blocks.slice().sort((a,b)=>a.s-b.s), tray=dayOf(k).tray, [a,b]=hourRange(list);
    const W=1080, HH=92, top=210, gx=170, gw=W-60-gx, trayH=tray.length?80+Math.ceil(tray.length/2)*58:0, H=top+(b-a)*HH+trayH+130;
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const c=cv.getContext('2d');
    c.fillStyle='#fff'; c.fillRect(0,0,W,H); imgHeader(c,md(cur),(S.name?S.name+'の':'')+'1日の予定');
    c.fillStyle='#f6f7fa'; rr(c,40,top-24,W-80,(b-a)*HH+48,28); c.fill();
    for(let h=a;h<=b;h++){ const y=top+(h-a)*HH; c.strokeStyle='#e3e7ee'; c.lineWidth=2; c.beginPath(); c.moveTo(gx,y); c.lineTo(gx+gw,y); c.stroke(); c.fillStyle='#8a93a3'; c.font=IM(24); c.textAlign='right'; c.fillText(h+':00',gx-18,y+8); c.textAlign='left'; }
    list.filter(x=>x.s+x.d>a*60&&x.s<b*60).forEach(x=>{
      const s=Math.max(x.s,a*60), e=Math.min(x.s+x.d,b*60), y=top+(s-a*60)/60*HH+2, h=Math.max((e-s)/60*HH-4,16);
      noteBlock(c,gx+6,y,gw-12,h,x.c);
      c.save(); rr(c,gx+6,y,gw-12,h,12); c.clip();
      if(h>=70){ c.fillStyle='#1b2430'; c.font=IF(800,32); c.fillText(fit(c,x.n,gw-80),gx+34,y+44); c.fillStyle='#5f6878'; c.font=IM(22); c.fillText(hm(x.s)+'–'+hm(x.s+x.d),gx+34,y+76); }
      else { const fs=h<30?18:h<40?22:28; c.fillStyle='#1b2430'; c.font=IF(800,fs); const n=fit(c,x.n,gw-260); c.fillText(n,gx+34,y+h/2+fs*.36); const w=c.measureText(n).width; c.fillStyle='#5f6878'; c.font=IM(Math.max(16,fs-6)); c.fillText(hm(x.s)+'–'+hm(x.s+x.d),gx+50+w,y+h/2+fs*.3); }
      c.restore();
    });
    let y=top+(b-a)*HH+60;
    if(tray.length){ c.fillStyle='#1b2430'; c.font=IF(800,28); c.fillText('時間はまだ決めていない予定',60,y+20); y+=44; const cw=(W-120)/2;
      tray.forEach((x,i)=>{ const xx=60+(i%2)*cw, yy=y+Math.floor(i/2)*58; noteBlock(c,xx,yy,cw-12,46,x.c); c.fillStyle='#1b2430'; c.font=IF(800,24); c.fillText(fit(c,x.n,cw-50),xx+22,yy+32); }); }
    c.fillStyle='#98a1b0'; c.font=IF(500,22); c.textAlign='right'; c.fillText('よていパズル',W-60,H-46); c.textAlign='left';
    return cv;
  }
  function drawWeek(){
    const mon=mondayOf(cur), days=[...Array(7)].map((_,i)=>{const d=addDays(mon,i);return {d,l:(S.days[keyOf(d)]||{blocks:[]}).blocks};});
    const all=days.flatMap(x=>x.l), [a,b]=hourRange(all);
    const W=1600, top=230, LAB=110, colW=(W-60-LAB-40)/7, HH=Math.max(44,Math.min(64,1000/(b-a))), H=top+(b-a)*HH+140, gx=60+LAB;
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const c=cv.getContext('2d');
    c.fillStyle='#fff'; c.fillRect(0,0,W,H); imgHeader(c,sd(mon)+' 〜 '+sd(addDays(mon,6)),(S.name?S.name+'の':'')+'1週間の予定');
    c.fillStyle='#f6f7fa'; rr(c,40,top-74,W-80,(b-a)*HH+100,28); c.fill();
    days.forEach((x,i)=>{ const cx=gx+i*colW, dw=x.d.getDay(); c.fillStyle=dw===6?'#3d63f0':dw===0?'#d92d20':'#1b2430'; c.font=IF(800,26); c.textAlign='center'; c.fillText(WD[dw]+' '+x.d.getDate(),cx+colW/2,top-30); c.textAlign='left'; });
    const step=(b-a)>12?2:1;
    for(let h=a;h<=b;h+=step){ const y=top+(h-a)*HH; c.strokeStyle='#e3e7ee'; c.lineWidth=1.5; c.beginPath(); c.moveTo(gx,y); c.lineTo(gx+7*colW,y); c.stroke(); c.fillStyle='#8a93a3'; c.font=IM(20); c.textAlign='right'; c.fillText(h+':00',gx-14,y+7); c.textAlign='left'; }
    days.forEach((x,i)=>{ const cx=gx+i*colW;
      x.l.filter(z=>z.s+z.d>a*60&&z.s<b*60).forEach(z=>{ const s=Math.max(z.s,a*60), e=Math.min(z.s+z.d,b*60), y=top+(s-a*60)/60*HH+2, h=Math.max((e-s)/60*HH-4,6);
        noteBlock(c,cx+4,y,colW-8,h,z.c);
        if(h>=24){ c.save(); rr(c,cx+4,y,colW-8,h,8); c.clip(); c.fillStyle='#1b2430'; c.font=IF(800,h<40?15:18); c.fillText(fit(c,z.n,colW-34),cx+20,y+(h<40?h/2+6:26)); c.restore(); }
      }); });
    c.fillStyle='#98a1b0'; c.font=IF(500,22); c.textAlign='right'; c.fillText('よていパズル',W-60,H-46); c.textAlign='left';
    return cv;
  }
  async function renderSend(){
    const k=keyOf(cur);
    $('app').innerHTML='<div class="scr"><div class="row"><button class="icon" data-back aria-label="もどる">'+ICON.back+'</button><div class="grow ttl" style="font-size:1.2rem">親に送る</div></div>'
      +'<div class="segm"><button data-k="day" class="'+(sendKind==='day'?'on':'')+'">'+sd(cur)+'</button><button data-k="week" class="'+(sendKind==='week'?'on':'')+'">この1週間</button></div>'
      +'<div class="scroll"><div class="preview" id="prev"><div class="empty" style="color:#5f6878">画像をつくっています…</div></div></div>'
      +'<div style="display:grid;gap:8px;flex:none"><button class="big-btn gold" data-share>LINEで送る</button><div class="acts"><button class="big-btn deep" data-save>画像を保存</button><button class="big-btn deep" data-full>全画面で表示</button></div><p class="hint">画像の長押しでも保存できます</p></div></div>';
    try{ await Promise.all(['800 30px "M PLUS Rounded 1c"','500 20px "M PLUS Rounded 1c"','500 20px "DM Mono"'].map(f=>document.fonts.load(f))); }catch(e){}
    if(screen!=='send') return;
    const cv=sendKind==='day'?drawDay():drawWeek(), url=cv.toDataURL('image/png');
    const fname=(sendKind==='day'?'予定_'+k:'予定_週_'+keyOf(mondayOf(cur)))+'.png';
    $('prev').innerHTML='<img src="'+url+'" alt="親に送る予定の画像">';
    let file=null; cv.toBlob(b=>{ try{ file=new File([b],fname,{type:'image/png'}); }catch(e){} },'image/png');
    const markSent=()=>{ S.sent[k]=true; save(); };
    $('app').onclick=async e=>{ let el;
      if(e.target.closest('[data-back]')){ go(backTo==='view'?'view':'home'); return; }
      if(el=e.target.closest('[data-k]')){ sendKind=el.dataset.k; renderSend(); return; }
      if(e.target.closest('[data-share]')){
        if(file&&navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file]}); markSent(); toast('送りました'); }catch(err){ if(err&&err.name!=='AbortError') toast('送れませんでした。「画像を保存」か長押しで保存してください'); } }
        else toast('この画面では使えません。「画像を保存」か長押しで保存してください');
        return; }
      if(e.target.closest('[data-save]')){
        try{ const a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); toast('保存されないときは、画像の長押しか「全画面で表示」を使ってね'); }catch(err){ toast('保存できませんでした。長押しか「全画面で表示」を使ってね'); }
        return; }
      if(e.target.closest('[data-full]')){ $('overRoot').innerHTML='<div class="full" role="dialog" aria-label="画像を全画面で表示"><img src="'+url+'" alt="親に送る予定の画像"><button data-fclose>とじる</button></div>'; markSent();
        $('overRoot').onclick=ev=>{ if(ev.target.closest('[data-fclose]')) $('overRoot').innerHTML=''; }; }
    };
  }

  // ===== その場で案内 =====
  function coach(steps,done){
    let i=0;
    const show=()=>{
      const st=steps[i], el=document.querySelector(st.sel);
      if(!el){ end(); return; }
      const r=el.getBoundingClientRect(), pad=4;
      const hole={l:r.left-pad,t:r.top-pad,w:r.width+pad*2,h:Math.min(r.height+pad*2,innerHeight*.5)};
      const below=hole.t+hole.h+14+130<innerHeight;
      const tipTop=below?hole.t+hole.h+14:Math.max(12,hole.t-150);
      const tipLeft=Math.min(Math.max(12,hole.l),innerWidth-272);
      $('overRoot').innerHTML='<div class="coach" role="dialog" aria-label="使い方の案内"><div class="hole" style="left:'+hole.l+'px;top:'+hole.t+'px;width:'+hole.w+'px;height:'+hole.h+'px"></div>'
        +'<div class="tip" style="left:'+tipLeft+'px;top:'+tipTop+'px">'+st.msg+'<div class="r"><button class="gold" data-cn>'+(i===steps.length-1?'わかった':'次へ')+'</button><button class="skip" data-cs>スキップ</button></div></div>'
        +(st.fx!=null?'<div class="finger" style="left:'+(hole.l+Math.min(hole.w,90)/2-17)+'px;top:'+(hole.t+Math.min(hole.h,60)/2-17)+'px;--fx:'+st.fx+'px;--fy:'+st.fy+'px"></div>':'')+'</div>';
      $('overRoot').onclick=e=>{ if(e.target.closest('[data-cs]')){end();return;} if(e.target.closest('[data-cn]')){ i++; if(i>=steps.length) end(); else show(); } };
    };
    const end=()=>{ $('overRoot').innerHTML=''; done&&done(); };
    show();
  }

  render();
  // ホーム画面に追加したとき、電波がなくても開けるように（HTTPS のときだけ動く）
  if('serviceWorker' in navigator&&window.isSecureContext&&location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>

</body>
