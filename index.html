<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOTETSU WORKS</title>
<meta name="description" content="KOTETSU WORKS のアプリ一覧">
<meta name="theme-color" content="#141418">
<link rel="icon" href="study-room/icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #141418; --card: #1d1d23; --line: rgba(255,255,255,.09); --text: #f2efe9; --muted: rgba(242,239,233,.62);
    --accent: #e6c068; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f3ee; --card: #ffffff; --line: rgba(0,0,0,.08); --text: #24211c; --muted: rgba(36,33,28,.6); --accent: #a9741a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 720px; margin: 0 auto; padding: calc(var(--safe-t) + 36px) 16px calc(var(--safe-b) + 40px); }
  header h1 { margin: 0; font-size: 28px; letter-spacing: .04em; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  h2 { margin: 28px 0 10px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
  a.app { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); color: inherit; text-decoration: none; min-height: 76px; transition: transform .12s ease, border-color .12s ease; }
  a.app:active { transform: scale(.98); }
  @media (hover: hover) { a.app:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); } }
  a.app img, a.app .ph { width: 48px; height: 48px; border-radius: 13px; flex: none; object-fit: cover; }
  a.app .ph { display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #1c1a17; }
  a.app .t { min-width: 0; }
  a.app b { display: block; font-size: 16px; }
  a.app small { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 99px; font-size: 10.5px; font-weight: 700; vertical-align: 2px; background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
  footer { margin-top: 36px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>KOTETSU WORKS</h1>
    <p>こてつが作っているアプリの入口です。</p>
  </header>

  <h2>勉強</h2>
  <div class="grid">
    <a class="app" href="study-room/"><img src="study-room/icon-192.png" alt=""><span class="t"><b>ROOMIN</b><small>勉強とパズルで、自分の部屋を育てる</small></span></a>
    <a class="app" href="test-study/"><img src="test-study/icon-192.png" alt=""><span class="t"><b>テスト勉強</b><small>大学の中間・期末テストの勉強</small></span></a>
    <a class="app" href="class-reminder"><span class="ph" style="background:#06c755;color:#fff">授</span><span class="t"><b>授業リマインダー</b><small>課題の締切・テスト・出席を LINE でお知らせ</small></span></a>
    <a class="app" href="フーリエ解析計算機.html"><span class="ph" style="background:#8fb8e8">∫</span><span class="t"><b>フーリエ解析計算機</b><small>レポート用の計算</small></span></a>
  </div>

  <h2>音楽</h2>
  <div class="grid">
    <a class="app" href="lyric-book/"><img src="lyric-book/icon-192.png" alt=""><span class="t"><b>LYRIC BOOK</b><small>歌詞と歌い方のノート</small></span></a>
    <a class="app" href="chord-analyzer/"><img src="chord-analyzer/icon-192.png" alt=""><span class="t"><b>ギターコード解析</b><small>曲のコードを調べる</small></span></a>
  </div>

  <h2>くらし・ゲーム</h2>
  <div class="grid">
    <a class="app" href="alarm/"><img src="alarm/icon-192.png" alt=""><span class="t"><b>目覚まし管理</b><small>起きる時間を決めて、iPhone のアラームに入れる</small></span></a>
    <a class="app" href="smagro-memory/"><img src="smagro-memory/icon-192.png" alt=""><span class="t"><b>スマグロ さいてきか</b><small>スマッシュグロウの、いちばん強い組み合わせ探し</small></span></a>
  </div>

  <h2>管理者</h2>
  <div class="grid">
    <a class="app" href="study-room-beta/"><img src="study-room/icon-beta-192.png" alt=""><span class="t"><b>ROOMIN<span class="tag">テスト版</span></b><small>管理者だけが入れます</small></span></a>
  </div>

  <footer>© KOTETSU WORKS</footer>
</main>
</body>
</html>
