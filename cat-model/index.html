<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>猫の体 確認画面</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #15171a; --panel: rgba(28, 31, 36, 0.92); --line: #2e333a; --text: #e8e6e1; --sub: #9aa0a8; --accent: #e7b46a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(6px); }
  #top { left: 12px; top: 12px; right: 12px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #top h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #top .stat { color: var(--sub); font-size: 12px; }
  #info { left: 12px; bottom: 12px; padding: 10px 14px; max-width: min(420px, calc(100% - 24px)); font-size: 13px; line-height: 1.5; }
  #info .ja { font-size: 16px; font-weight: 600; }
  #info .la { color: var(--accent); font-style: italic; }
  #info .sub { color: var(--sub); font-size: 12px; }
  #side { right: 12px; top: 64px; bottom: 12px; width: 250px; padding: 10px 12px; overflow-y: auto; font-size: 13px; }
  #side h2 { font-size: 12px; color: var(--sub); font-weight: 600; margin: 12px 0 6px; letter-spacing: .04em; }
  #side h2:first-child { margin-top: 0; }
  label.row { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  .slider { display: grid; grid-template-columns: 1fr; gap: 2px; margin: 6px 0; }
  .slider span { color: var(--sub); font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  button { background: #2a2f36; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  #toggle { display: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--sub); font-size: 14px; pointer-events: none; }
  @media (max-width: 700px) {
    #side { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 45vh; display: none; }
    #side.open { display: block; z-index: 2; }
    #toggle { display: inline-block; margin-left: auto; }
    #top h1 { font-size: 14px; }
    #top .stat { order: 3; width: 100%; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div id="loading">体のモデルを読みこんでいます…</div>
<div id="top" class="panel">
  <h1>猫の体 確認画面</h1>
  <span class="stat" id="stat"></span>
  <button id="toggle">設定</button>
</div>
<div id="info" class="panel"><div class="sub">骨や筋肉をタップすると名前が出ます。ドラッグで回転、ピンチ・ホイールで拡大。</div></div>
<div id="side" class="panel">
  <h2>見る向き</h2>
  <div class="btns">
    <button data-view="side">横</button><button data-view="front">前</button><button data-view="top">上</button><button data-view="back">後ろ</button><button data-view="persp">ななめ</button>
  </div>
  <h2>名前でさがす</h2>
  <select id="bonelist" style="width:100%;background:#2a2f36;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:13px"><option value="">— 骨・筋肉をえらぶ —</option></select>
  <label class="row"><input type="checkbox" id="onlysel"> えらんだものだけ表示</label>
  <h2>体の層</h2>
  <div id="layers"></div>
  <h2>表示する部分</h2>
  <div id="regions"></div>
  <h2>ポーズを試す</h2>
  <div id="pose"></div>
  <div class="btns" style="margin-top:6px"><button id="reset">ポーズを戻す</button><button id="explode">分解する</button></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const modelUrl = 'models/' + (params.get('model') || 'cat-anatomy.glb');

const REGIONS = { skull: '頭の骨・歯', spine: '背骨', tail: 'しっぽ', thorax: '肋骨・胸骨', forelimb: '前足', hindlimb: '後ろ足', organ: '内臓・目', skin: '皮ふ・毛' };
const KINDS = { bone: '骨', tooth: '歯', cartilage: '軟骨', disc: '椎間板', claw: '爪', muscle: '筋肉', tendon: '腱・靱帯', organ: '内臓', eye: '目', skin: '皮ふ', whisker: 'ひげ' };
const LAYERS = { 1: '表層（いちばん外）', 2: '中間層', 3: '深層（骨のすぐそば）' };
const GROUPS = { head: '頭', neck: '首', trunk: '胴', forelimb: '肩・前足', hindlimb: '腰・後ろ足', tail: 'しっぽ' };
// 骨のノードは、筋肉の骨組み（ボーン）にもなっているので、形はその子にある
const ownMesh = (o) => (o.isMesh ? o : o.children.find((c) => c.isMesh && !c.userData.ja));
const nodeOf = (m) => (m.userData.ja ? m : m.parent);

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.005, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.17, 0.05);

scene.add(new THREE.HemisphereLight(0xfff4e6, 0x30343a, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(0.6, 1.2, 0.8); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -0.5, right: 0.5, top: 0.5, bottom: -0.5, near: 0.1, far: 4 });
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fc4ff, 0.8); rim.position.set(-0.8, 0.5, -0.6); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(0.8, 64), new THREE.MeshStandardMaterial({ color: 0x23272d, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(1.0, 20, 0x3a4048, 0x2a2f36); grid.position.y = 0.0005; scene.add(grid);

const VIEWS = {
  side: [1.0, 0.18, 0.1], front: [0, 0.2, 1.0], top: [0.001, 1.2, 0.1], back: [0, 0.25, -0.8], persp: [0.85, 0.45, 0.95],
};
function setView(name) {
  const p = VIEWS[name] || VIEWS.persp;
  controls.target.set(0, 0.16, 0.1);
  // 縦長の画面では、猫全体が入るように少し引く
  const k = camera.aspect < 1.3 ? 1.25 / camera.aspect : 1;
  camera.position.set(p[0] * k, 0.16 + (p[1] - 0.16) * k, controls.target.z + (p[2] - controls.target.z) * k);
  controls.update();
}
setView(params.get('view') || 'persp');
if (params.get('cam')) { const c = params.get('cam').split(',').map(Number); camera.position.set(c[0], c[1], c[2]); }
if (params.get('tgt')) { const t = params.get('tgt').split(',').map(Number); controls.target.set(t[0], t[1], t[2]); }
if (params.get('fov')) { camera.fov = +params.get('fov'); camera.updateProjectionMatrix(); }
if (params.get('ui') === '0') document.querySelectorAll('.panel').forEach((p) => (p.style.display = 'none'));
controls.update();

const info = document.getElementById('info');
const nodes = new Map();
const rest = new Map();
let root;

new GLTFLoader().load(modelUrl, (gltf) => {
  root = gltf.scene;
  scene.add(root);
  let meshes = 0, tris = 0;
  const counts = {};
  root.traverse((o) => {
    if (o.userData && o.userData.region) {
      nodes.set(o.name, o);
      rest.set(o.name, { q: o.quaternion.clone(), p: o.position.clone() });
      const k = o.userData.kind || 'bone'; counts[k] = (counts[k] || 0) + 1;
    }
    if (o.isMesh) {
      meshes++; tris += o.geometry.index.count / 3;
      o.castShadow = true; o.receiveShadow = true;
      o.material = o.material.clone(); // 骨ごとに表示を切りかえられるように
    }
  });
  document.getElementById('stat').textContent = Object.entries(counts).map(([k, v]) => `${KINDS[k] || k} ${v}`).join('・') + `　三角形 ${Math.round(tris / 1000)}k`;
  document.getElementById('loading').remove();
  buildFur();
  buildLayers();
  buildRegions();
  buildPose();
  buildList();
  if (params.get('pose')) { for (const kv of params.get('pose').split(',')) { const [k, v] = kv.split(':'); poseVal[k] = +v; } applyPose(); }
  if (params.get('solo')) solo(params.get('solo').split(','));
  window.__ready = true;
}, undefined, (e) => { document.getElementById('loading').textContent = '読みこめませんでした: ' + e.message; });

// 指定した骨だけを表示して、画面いっぱいに映す（確認用）
function solo(ids) {
  root.updateMatrixWorld(true);
  const keep = new Set(ids);
  for (const [n, o] of nodes) setOwnVisible(o, keep.has(n));
  const box = new THREE.Box3();
  for (const id of ids) {
    const o = nodes.get(id); const m = o && ownMesh(o); if (!m) continue;
    m.geometry.computeBoundingBox();
    box.union(m.geometry.boundingBox.clone().applyMatrix4(m.isSkinnedMesh ? new THREE.Matrix4() : m.matrixWorld));
  }
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()); const r = box.getSize(new THREE.Vector3()).length() * 0.5;
  const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
  controls.target.copy(c);
  camera.position.copy(c).addScaledVector(dir, r / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.0);
  camera.near = r * 0.05; camera.updateProjectionMatrix();
  floor.visible = grid.visible = false;
  controls.update();
}

function setMuscleOpacity(a) {
  for (const o of nodes.values()) if (o.userData.region === 'muscle') {
    const m = ownMesh(o); m.material.transparent = a < 1; m.material.opacity = a; m.material.depthWrite = a >= 1; m.castShadow = a >= 1;
  }
}

// 骨の一覧
function buildList() {
  const sel = document.getElementById('bonelist');
  const groups = {};
  for (const [n, o] of nodes) { if (!ownMesh(o)) continue; (groups[o.userData.region] ||= []).push([n, o]); }
  for (const [k, label] of Object.entries({ muscle: '筋肉', ...REGIONS })) {
    if (!groups[k]) continue;
    const g = document.createElement('optgroup'); g.label = label;
    for (const [n, o] of groups[k]) {
      const u = o.userData; const op = document.createElement('option'); op.value = n;
      op.textContent = u.ja + (u.side === 'L' ? '（左）' : u.side === 'R' ? '（右）' : '');
      g.appendChild(op);
    }
    sel.appendChild(g);
  }
  const apply = () => {
    const n = sel.value; const only = document.getElementById('onlysel').checked;
    if (!n) { for (const o of nodes.values()) setOwnVisible(o, true); return; }
    select(nodes.get(n));
    if (only) solo([n]); else for (const o of nodes.values()) setOwnVisible(o, true);
  };
  sel.onchange = apply;
  document.getElementById('onlysel').onchange = () => { if (!document.getElementById('onlysel').checked) { floor.visible = grid.visible = true; } apply(); };
}

// ===== 毛（皮ふを少しずつ外へずらした層を重ねる） =====
const furLayers = [];
const FUR_N = params.get('fur') ? +params.get('fur') : (Math.min(innerWidth, innerHeight) < 700 || (navigator.hardwareConcurrency || 4) < 6 ? 12 : 26);
function furMaterial(t) {
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uT = { value: t };
    sh.uniforms.uLen = { value: 0.012 };   // A=1 のときの毛の長さ（m）
    sh.vertexShader = 'uniform float uT; uniform float uLen; varying vec3 vRest; varying float vFur;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vRest = position;
      float furL = vColor.a * uLen;
      vFur = vColor.a;
      vec3 comb = vec3(0.0, -0.45, -0.9);
      comb = normalize(comb - objectNormal * dot(comb, objectNormal) + vec3(1e-5));
      transformed += objectNormal * furL * uT + comb * furL * uT * uT * 0.9;`).replace('#include <color_vertex>', '').replace('#include <begin_vertex>', '#include <color_vertex>\n#include <begin_vertex>');
    sh.fragmentShader = 'uniform float uT; varying vec3 vRest; varying float vFur;\n' +
      'float h31(vec3 p){ p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }\n' +
      sh.fragmentShader.replace('#include <alphatest_fragment>', `
      if (vFur < 0.02) discard;
      vec3 q = vRest * 2600.0;               // 毛の太さ：約0.4mm のます目
      vec3 c = floor(q);
      float r = h31(c);
      float d = length(fract(q) - 0.5);
      float lenR = 0.55 + 0.45 * r;           // 毛ごとの長さのちがい
      if (uT > lenR || d > 0.55 * (1.0 - uT / lenR) + 0.08) discard;
      diffuseColor.rgb *= mix(0.55, 1.08, uT) * (0.9 + 0.2 * r);`);
  };
  m.customProgramCacheKey = () => 'fur' + t.toFixed(3);
  return m;
}
function buildFur() {
  for (const o of nodes.values()) {
    if (o.userData.kind !== 'skin') continue;
    const base = ownMesh(o); if (!base) continue;
    for (let i = 1; i <= FUR_N; i++) {
      const t = i / FUR_N;
      let shell;
      if (base.isSkinnedMesh) { shell = new THREE.SkinnedMesh(base.geometry, furMaterial(t)); shell.bind(base.skeleton, base.bindMatrix); }
      else shell = new THREE.Mesh(base.geometry, furMaterial(t));
      shell.position.copy(base.position); shell.quaternion.copy(base.quaternion); shell.scale.copy(base.scale);
      shell.frustumCulled = false; shell.castShadow = i === 1; shell.receiveShadow = true;
      shell.userData.furOf = o;
      base.parent.add(shell);
      furLayers.push(shell);
    }
  }
}

// ===== 体の層（毛・皮ふ・筋肉・内臓・骨） =====
const LAYER_DEF = [
  { key: 'fur', label: '毛', test: null },
  { key: 'skin', label: '皮ふ（ひげ・目をふくむ）', test: (u) => ['skin', 'whisker'].includes(u.kind) || u.kind === 'eye' },
  { key: 'muscle', label: '筋肉・腱', test: (u) => u.region === 'muscle' },
  { key: 'organ', label: '内臓', test: (u) => u.region === 'organ' && u.kind !== 'eye' },
  { key: 'bone', label: '骨・歯・軟骨・爪', test: (u) => !['muscle', 'organ', 'skin'].includes(u.region) && !['skin', 'whisker', 'eye'].includes(u.kind) },
];
const layerOn = {};
function applyLayers() {
  for (const L of LAYER_DEF) {
    if (L.key === 'fur') { for (const f of furLayers) f.visible = layerOn.fur && layerOn.skin; continue; }
    for (const o of nodes.values()) if (L.test(o.userData)) setOwnVisible(o, layerOn[L.key]);
  }
}
function buildLayers() {
  const box = document.getElementById('layers');
  const hasSkin = [...nodes.values()].some((o) => o.userData.kind === 'skin');
  for (const L of LAYER_DEF) {
    if ((L.key === 'fur' || L.key === 'skin') && !hasSkin) continue;
    // 皮ふがあるときは、中の層はかくしておく（軽くするため）
    layerOn[L.key] = params.get('layers') ? params.get('layers').split(',').includes(L.key) : (hasSkin ? ['fur', 'skin'].includes(L.key) : true);
    const row = document.createElement('label'); row.className = 'row';
    row.innerHTML = `<input type="checkbox" ${layerOn[L.key] ? 'checked' : ''}> ${L.label}`;
    row.querySelector('input').onchange = (e) => { layerOn[L.key] = e.target.checked; applyLayers(); };
    box.appendChild(row);
  }
  if (!hasSkin) { layerOn.fur = false; layerOn.skin = false; }
  applyLayers();
}

// 部分の表示切りかえ
function buildRegions() {
  const box = document.getElementById('regions');
  const present = new Set([...nodes.values()].map((o) => o.userData.region));
  if (present.has('muscle')) {
    const head = document.createElement('div'); head.className = 'sub'; head.style.cssText = 'color:var(--sub);font-size:12px;margin:2px 0'; head.textContent = '筋肉'; box.appendChild(head);
    for (const [k, label] of Object.entries(LAYERS)) {
      const row = document.createElement('label'); row.className = 'row';
      row.innerHTML = `<input type="checkbox" checked> ${label}`;
      row.querySelector('input').onchange = (e) => { for (const o of nodes.values()) if (o.userData.region === 'muscle' && String(o.userData.layer) === k) setOwnVisible(o, e.target.checked); };
      box.appendChild(row);
    }
    const sl = document.createElement('div'); sl.className = 'slider';
    sl.innerHTML = '<span>筋肉の濃さ（うすくすると骨が透けて見える）</span><input type="range" id="musop" min="0.15" max="1" step="0.05" value="1">';
    sl.querySelector('input').oninput = (e) => setMuscleOpacity(+e.target.value);
    box.appendChild(sl);
    const head2 = document.createElement('div'); head2.className = 'sub'; head2.style.cssText = 'color:var(--sub);font-size:12px;margin:8px 0 2px'; head2.textContent = '骨'; box.appendChild(head2);
  }
  for (const [k, label] of Object.entries(REGIONS)) { if (k === "organ" || k === "skin") continue;
    if (!present.has(k)) continue;
    const row = document.createElement('label'); row.className = 'row';
    row.innerHTML = `<input type="checkbox" checked> ${label}`;
    row.querySelector('input').onchange = (e) => { for (const o of nodes.values()) if (o.userData.region === k) setOwnVisible(o, e.target.checked); };
    box.appendChild(row);
  }
  for (const [k, label] of Object.entries({ cartilage: '軟骨・椎間板を表示', claw: '爪を表示' })) {
    const row = document.createElement('label'); row.className = 'row';
    row.innerHTML = `<input type="checkbox" checked> ${label}`;
    row.querySelector('input').onchange = (e) => { for (const o of nodes.values()) if (o.userData.kind === k || (k === 'cartilage' && o.userData.kind === 'disc')) setOwnVisible(o, e.target.checked); };
    box.appendChild(row);
  }
}
// 子の骨は残して、その骨の形だけ消す
function setOwnVisible(o, v) { const m = ownMesh(o); if (m) m.material.visible = v; }

// ポーズ（関節を曲げる）。角度はすべて「横から見た曲げ」
// 回転は、横軸（x）まわりの角度。プラスで「前が下がる」向き。
const POSE = [
  { key: 'spine', label: '背中を丸める ⇄ 反らす', min: -20, max: 30, apply: (a) => spread(['L1','L2','L3','L4','L5','L6','L7','T10','T11','T12','T13'], a) },
  { key: 'neck', label: '首を上げる ⇄ 下げる', min: -35, max: 35, apply: (a) => spread(['C2','C3','C4','C5','C6','C7','T1'], a) },
  { key: 'jaw', label: '口を開ける', min: 0, max: 40, apply: (a) => { for (const s of ['L', 'R']) rot('Mandible_' + s, a); } },
  { key: 'tail', label: 'しっぽを上げる', min: -20, max: 110, apply: (a) => spread(Array.from({ length: 21 }, (_, i) => 'Cd' + (i + 1)), a) },
  { key: 'fore', label: '前足を曲げる', min: -15, max: 60, apply: (a) => { for (const s of ['L', 'R']) { rot('Humerus_' + s, -a * 0.4); rot('Radius_' + s, a); rot('Ulna_' + s, a); rot('RadialCarpal_' + s, a * 1.2); } } },
  { key: 'hind', label: '後ろ足を曲げる', min: -15, max: 50, apply: (a) => { for (const s of ['L', 'R']) { rot('Femur_' + s, -a * 0.8); rot('Tibia_' + s, a * 1.3); rot('Talus_' + s, -a * 1.1); } } },
];
const poseVal = {};
function rot(name, deg) {
  const o = nodes.get(name); if (!o) return;
  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), THREE.MathUtils.degToRad(deg));
  o.quaternion.copy(rest.get(name).q).multiply(q);
}
// 背骨のように、何個かの骨で少しずつ曲げる
function spread(names, total) {
  const list = names.filter((n) => nodes.has(n));
  for (const n of list) rot(n, total / list.length);
}
function buildPose() {
  const box = document.getElementById('pose');
  for (const p of POSE) {
    poseVal[p.key] = 0;
    const d = document.createElement('div'); d.className = 'slider';
    d.innerHTML = `<span>${p.label}</span><input type="range" min="${p.min}" max="${p.max}" value="0">`;
    d.querySelector('input').oninput = (e) => { poseVal[p.key] = +e.target.value; applyPose(); };
    box.appendChild(d);
  }
}
function applyPose() {
  for (const [n, r] of rest) nodes.get(n).quaternion.copy(r.q);
  for (const p of POSE) if (poseVal[p.key]) p.apply(poseVal[p.key]);
}
document.getElementById('reset').onclick = () => { document.querySelectorAll('#pose input').forEach((i) => (i.value = 0)); for (const k in poseVal) poseVal[k] = 0; applyPose(); };

// 分解（骨をばらす）
let exploded = 0, explodeTarget = 0;
document.getElementById('explode').onclick = (e) => {
  explodeTarget = explodeTarget ? 0 : 1; e.target.textContent = explodeTarget ? '元に戻す' : '分解する';
  for (const o of nodes.values()) if (o.userData.region === 'muscle') { const m = ownMesh(o); if (m) m.visible = !explodeTarget; }
};
function applyExplode(t) {
  for (const [n, r] of rest) {
    const o = nodes.get(n);
    o.position.copy(r.p).multiplyScalar(1 + t * 0.35);
  }
}

document.querySelectorAll('[data-view]').forEach((b) => (b.onclick = () => setView(b.dataset.view)));
document.getElementById('toggle').onclick = () => document.getElementById('side').classList.toggle('open');

// タップで骨の名前
const ray = new THREE.Raycaster();
let down = null, highlighted = null;
renderer.domElement.addEventListener('pointerdown', (e) => (down = [e.clientX, e.clientY]));
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6 || !root) return;
  const m = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(m, camera);
  const hit = ray.intersectObject(root, true).find((h) => h.object.material.visible !== false);
  if (!hit) { select(null); return; }
  select(nodeOf(hit.object));
});
function select(o) {
  if (highlighted) { highlighted.material.emissive.setHex(0x000000); highlighted = null; }
  if (!o) return;
  const mesh = ownMesh(o);
  if (mesh) { highlighted = mesh; mesh.material.emissive.setHex(0x7a4a10); }
  const u = o.userData;
  const side = u.side === 'L' ? '（左）' : u.side === 'R' ? '（右）' : '';
  if (u.region === 'muscle') {
    info.innerHTML = `<div class="ja">${u.ja}${side}</div><div class="la">${u.la || ''}</div>` +
      `<div class="sub">${KINDS[u.kind] || '筋肉'}・${GROUPS[u.group] || ''}・${LAYERS[u.layer] || ''}</div>` +
      `<div style="margin-top:6px"><b>起始（はじまる所）</b>：${u.origin}<br><b>停止（付く所）</b>：${u.insertion}<br><b>働き</b>：${u.action}</div>`;
    return;
  }
  const rom = u.rom && u.rom.flexion ? `<div class="sub">${u.rom.joint}の動く範囲：曲げて ${u.rom.flexion}° 〜 のばして ${u.rom.extension}°</div>` : '';
  info.innerHTML = `<div class="ja">${u.ja}${side}</div><div class="la">${u.la || ''}</div><div class="sub">${REGIONS[u.region] || ''}・${KINDS[u.kind] || ''}・${o.name}</div>${rom}`;
}

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => {
  if (Math.abs(exploded - explodeTarget) > 0.001) { exploded += (explodeTarget - exploded) * 0.12; applyExplode(exploded); }
  controls.update();
  renderer.render(scene, camera);
});
window.__setView = setView;
window.__camera = camera; window.__controls = controls;
</script>
</body>
</html>
