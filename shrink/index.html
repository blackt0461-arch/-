<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>動画かるく</title>
<meta name="description" content="Claude に渡す動画・画像を、スマホやパソコンの中だけで軽くする。動画は大事な場面をまとめ画像にする。">
<meta name="theme-color" content="#121216">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="動画かるく">
<style>
:root {
  --bg: #121216; --card: rgba(255,255,255,.05); --card2: rgba(255,255,255,.08); --line: rgba(255,255,255,.1);
  --text: #f2efe9; --muted: rgba(242,239,233,.6); --accent: #2a9d8f; --accent2: #3cc4b2; --gold: #ffd25e; --warn: #ff8a7a;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
main { max-width: 760px; margin: 0 auto; padding: calc(var(--safe-t) + 18px) 16px calc(var(--safe-b) + 40px); }
header { display: flex; align-items: center; gap: 12px; }
header img { width: 44px; height: 44px; border-radius: 12px; }
header h1 { margin: 0; font-size: 20px; }
header p { margin: 0; color: var(--muted); font-size: 12.5px; }
header a.home { margin-left: auto; color: var(--muted); font-size: 12px; text-decoration: none; border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }

.tabs { display: flex; gap: 6px; padding: 4px; border-radius: 14px; background: var(--card); margin: 18px 0 14px; }
.tabs button { flex: 1; border: 0; border-radius: 10px; padding: 10px 6px; background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
.tabs button.on { background: var(--text); color: #121216; }

.drop { display: grid; place-items: center; text-align: center; gap: 8px; padding: 34px 16px; border-radius: 20px; border: 2px dashed var(--line); background: var(--card); cursor: pointer; }
.drop.over { border-color: var(--accent2); background: var(--card2); }
.drop b { font-size: 17px; }
.drop small { color: var(--muted); }
.drop.compact { padding: 14px 16px; }
.drop.compact small { display: none; }
.btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 999px; padding: 12px 20px; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer;
  background: var(--accent); color: #fff; text-decoration: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sub { background: var(--card2); color: var(--text); border: 1px solid var(--line); }
.btn.small { padding: 8px 14px; font-size: 13px; }
.btn.big { width: 100%; padding: 15px; font-size: 16px; }

.panel { margin-top: 14px; padding: 14px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
.panel[hidden], [hidden] { display: none !important; }
.fileinfo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fileinfo .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.fileinfo .meta { color: var(--muted); font-size: 13px; }
video.preview { width: 100%; max-height: 46vh; border-radius: 12px; background: #000; margin-top: 10px; display: block; }

details { margin-top: 12px; }
summary { cursor: pointer; color: var(--muted); font-weight: 700; font-size: 14px; padding: 6px 0; }
.opts { display: grid; gap: 14px; padding: 8px 0 4px; }
.opt > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 11px; background: rgba(0,0,0,.25); flex-wrap: wrap; }
.seg button { flex: 1; border: 0; border-radius: 8px; padding: 8px 6px; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; min-width: 64px; }
.seg button.on { background: var(--accent); color: #fff; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input[type=number] { width: 84px; font: inherit; font-size: 16px; color: var(--text); background: #0c0c10; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
label.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
label.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.range-val { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 700; }

.progress { margin-top: 14px; }
.bar { height: 8px; border-radius: 99px; background: var(--card2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .15s; }
.progress p { margin: 8px 0 0; color: var(--muted); font-size: 13px; }

.result h2 { margin: 0 0 4px; font-size: 17px; }
.summary { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
.summary b { color: var(--gold); }
.actions { display: grid; gap: 8px; margin-bottom: 12px; }
.actions .row .btn { flex: 1; }
.sheets { display: grid; gap: 12px; }
.sheet { border-radius: 14px; overflow: hidden; background: #000; border: 1px solid var(--line); }
.sheet img { display: block; width: 100%; height: auto; }
.sheet .bar2 { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--card); font-size: 12.5px; color: var(--muted); }
.sheet .bar2 span { flex: 1; }
.note { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
.err { color: var(--warn); font-size: 14px; margin: 12px 0 0; white-space: pre-wrap; }
.toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 24px); transform: translateX(-50%); background: var(--text); color: #121216; padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
.toast.show { opacity: 1; }
footer { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.8; }
footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon-192.png" alt="">
    <div><h1>動画かるく</h1><p>Claude に渡す動画・画像を軽くする</p></div>
    <a class="home" href="/">KOTETSU WORKS</a>
  </header>

  <div class="tabs" role="tablist">
    <button class="on" data-tab="sheet">まとめ画像にする</button>
    <button data-tab="video">動画のまま軽く</button>
  </div>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="video/*,image/*" hidden>
    <b id="dropTitle">動画か画像を選ぶ</b>
    <small id="dropSub">選ぶと自動で、大事な場面を数枚のまとめ画像にします</small>
    <span class="btn small sub">ファイルを選ぶ</span>
  </label>

  <section class="panel" id="filePanel" hidden>
    <div class="fileinfo">
      <span class="name" id="fname"></span>
      <span class="meta" id="fmeta"></span>
    </div>
    <video class="preview" id="preview" playsinline muted controls hidden></video>

    <details id="moreSheet">
      <summary>細かい設定</summary>
      <div class="opts">
        <div class="opt"><span>場面の選び方</span>
          <div class="seg" data-key="pick"><button data-v="auto" class="on">おまかせ（画面が変わった所）</button><button data-v="even">一定の間隔</button></div>
        </div>
        <div class="opt" id="evenOpt" hidden><span>何秒ごと</span>
          <div class="row"><input type="number" id="interval" min="0.5" step="0.5" value="5"> 秒</div>
        </div>
        <div class="opt"><span>場面の数</span>
          <div class="seg" data-key="count"><button data-v="auto" class="on">おまかせ</button><button data-v="9">9</button><button data-v="18">18</button><button data-v="36">36</button><button data-v="72">72</button></div>
        </div>
        <div class="opt"><span>1枚に並べる数</span>
          <div class="seg" data-key="per"><button data-v="4">4（文字を読ませたい）</button><button data-v="9" class="on">9（ふつう）</button><button data-v="16">16</button></div>
        </div>
        <label class="check"><input type="checkbox" id="stamp" checked> 各場面に時間を入れる（例 1:23）</label>
        <label class="check"><input type="checkbox" id="gray"> 白黒にする</label>
      </div>
    </details>

    <details id="moreVideo" open hidden>
      <summary>画質</summary>
      <div class="opts">
        <div class="opt"><span>画質</span>
          <div class="seg" data-key="q"><button data-v="s">小（いちばん軽い）</button><button data-v="m" class="on">中</button><button data-v="l">大（きれい）</button></div>
        </div>
      </div>
    </details>

    <details id="moreRange">
      <summary>使う範囲（始め〜終わり）</summary>
      <div class="opts">
        <p class="note" style="margin:0">上の動画を動かして、ボタンで始めと終わりを決めます。</p>
        <div class="row"><button class="btn small sub" id="setStart">いまの位置を始めに</button><span>始め <span class="range-val" id="startVal">0:00</span></span></div>
        <div class="row"><button class="btn small sub" id="setEnd">いまの位置を終わりに</button><span>終わり <span class="range-val" id="endVal">-</span></span></div>
        <div><button class="btn small sub" id="resetRange">最初から最後までに戻す</button></div>
      </div>
    </details>

    <div style="margin-top:12px"><button class="btn big" id="run">作る</button></div>
    <div class="progress" id="progress" hidden><div class="bar"><i id="barFill"></i></div><p id="progText"></p></div>
    <p class="err" id="err" hidden></p>
  </section>

  <section class="panel result" id="result" hidden>
    <h2 id="resTitle">できました</h2>
    <p class="summary" id="resSummary"></p>
    <div class="actions">
      <button class="btn big" id="shareAll" hidden>Claude に送る・保存する</button>
      <div class="row">
        <button class="btn sub" id="downloadAll">ダウンロード</button>
      </div>
    </div>
    <div class="sheets" id="sheets"></div>
    <video class="preview" id="outVideo" playsinline controls hidden></video>
    <p class="note" id="resNote"></p>
  </section>

  <footer>
    ファイルはこの機械の中だけで処理し、どこにも送りません。<br>
    「動画のまま軽く」は <a href="https://github.com/Vanilagy/mediabunny" target="_blank" rel="noopener">Mediabunny</a>（Mozilla Public License 2.0）を使っています。<br>
    © KOTETSU WORKS
  </footer>
</main>
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
