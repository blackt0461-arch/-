<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="目覚まし">
<title>目覚まし管理</title>
<style>
  :root {
    --bg: #f4f4f6; --card: #ffffff; --text: #1c1c1e; --muted: #6e6e73; --line: #e2e2e6;
    --accent: #e8743b; --accent-text: #ffffff; --danger: #d93a32; --ok: #2f8a4c; --chip: #f1e4dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111113; --card: #1c1c1f; --text: #f2f2f4; --muted: #9a9aa1; --line: #2c2c31;
      --accent: #f08a52; --accent-text: #1a0d05; --danger: #ff6b62; --ok: #5fc27c; --chip: #3a2a20;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111113; --card: #1c1c1f; --text: #f2f2f4; --muted: #9a9aa1; --line: #2c2c31;
    --accent: #f08a52; --accent-text: #1a0d05; --danger: #ff6b62; --ok: #5fc27c; --chip: #3a2a20;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 0 8px; }
  h1 { font-size: 26px; margin: 0; }
  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 24px 4px 8px; }
  .status { font-size: 13px; color: var(--muted); }
  .status.err { color: var(--danger); }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); min-height: 52px; }
  .row:first-child { border-top: 0; }
  .day { width: 2.2em; font-weight: 700; flex: none; }
  .date { width: 4.6em; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .times { flex: 1; font-variant-numeric: tabular-nums; min-width: 0; }
  .times.off { color: var(--muted); }
  .chip { font-size: 12px; background: var(--chip); color: var(--accent); border-radius: 6px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 8px 12px; background: var(--line); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); font-weight: 700; }
  button.danger { color: var(--danger); background: transparent; padding: 8px; }
  button.link { background: transparent; color: var(--accent); padding: 8px 4px; }
  button:disabled { opacity: .45; }
  input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  input[type="time"] { min-width: 0; width: 7em; }
  #weekly .row { gap: 6px; padding: 10px 12px; }
  #weekly select { padding: 6px 2px; }
  #weekly .day { width: 1.4em; }
  label.switch { display: inline-flex; align-items: center; gap: 6px; }
  .sub { font-size: 13px; color: var(--muted); }
  .grow { flex: 1; }
  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px);
    display: flex; justify-content: center; border-top: 1px solid var(--line);
  }
  .savebar button { width: 100%; max-width: 560px; padding: 14px; font-size: 17px; }
  details summary { cursor: pointer; padding: 12px 14px; }
  .settings { padding: 0 14px 14px; display: grid; gap: 10px; }
  .settings input { width: 100%; }
  dialog { border: 0; border-radius: 16px; background: var(--card); color: var(--text); width: min(92vw, 400px); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h3 { margin: 0 0 12px; }
  .stack { display: grid; gap: 12px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .empty { padding: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>目覚まし</h1>
    <span id="status" class="status">読み込み中…</span>
  </header>

  <h2>これから14日</h2>
  <div class="card" id="upcoming"></div>

  <h2>曜日ごとの基本パターン</h2>
  <div class="card" id="weekly"></div>
  <p class="sub" style="margin:6px 4px">「+5分×2」は、最初の時刻のあと5分おきに2回追加で鳴らす設定です。</p>

  <h2>例外の日</h2>
  <div class="card" id="overrides"></div>

  <h2>設定</h2>
  <div class="card">
    <details id="settingsBox">
      <summary>GitHub接続</summary>
      <div class="settings">
        <label>データのリポジトリ（owner/repo）<input id="cfgRepo" placeholder="blackt0461-arch/alarm-data" autocomplete="off"></label>
        <label>ファイル<input id="cfgPath" placeholder="alarms.json" autocomplete="off"></label>
        <label>トークン（このリポジトリの Contents 読み書き権限のみ）<input id="cfgToken" type="password" autocomplete="off"></label>
        <p class="sub">トークンはこの端末のブラウザにだけ保存されます。</p>
        <div class="actions"><button class="primary" id="cfgSave">保存して再読み込み</button></div>
      </div>
    </details>
  </div>
</main>

<div class="savebar"><button class="primary" id="saveBtn" disabled>変更なし</button></div>

<dialog id="dayDialog">
  <form method="dialog" class="stack">
    <h3 id="dlgTitle"></h3>
    <p class="sub" id="dlgBase"></p>
    <label class="switch"><input type="radio" name="mode" value="time" checked> 時刻を指定</label>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input type="time" id="dlgTime" value="06:30">
      <span>+</span><select id="dlgInterval"></select><span>×</span><select id="dlgExtra"></select>
    </div>
    <label class="switch"><input type="radio" name="mode" value="off"> この日は鳴らさない</label>
    <div class="actions">
      <button value="reset" id="dlgReset" class="link">例外を解除</button>
      <span class="grow"></span>
      <button value="cancel">キャンセル</button>
      <button value="ok" class="primary">決定</button>
    </div>
  </form>
</dialog>

<script type="module">
import { DAYS, DAY_JA, emptyData, regenerate, resolveDay, expandTimes, todayJST, addDays, weekdayKey } from './schedule.js';

const $ = id => document.getElementById(id);
const ORDER = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let data = emptyData();
let sha = null;
let dirty = false;

function setStatus(text, err = false) {
  $('status').textContent = text;
  $('status').className = 'status' + (err ? ' err' : '');
}
function markDirty() {
  dirty = true;
  $('saveBtn').disabled = false;
  $('saveBtn').textContent = '保存してiPhoneに反映';
  render();
}
function describe(slot) {
  if (!slot) return 'なし';
  return slot.extra ? `${slot.time}（+${slot.interval || 5}分×${slot.extra}）` : slot.time;
}
function options(sel, values, suffix, current) {
  sel.innerHTML = values.map(v => `<option value="${v}"${v === current ? ' selected' : ''}>${v}${suffix}</option>`).join('');
}
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

// ---------- rendering ----------
function render() {
  const today = todayJST();
  const up = $('upcoming');
  up.innerHTML = '';
  for (let i = 0; i < 14; i++) {
    const date = addDays(today, i);
    const { source, slot } = resolveDay(data, date);
    const row = el(`<div class="row" role="button" tabindex="0" style="cursor:pointer">
      <span class="date">${date.slice(5).replace('-', '/')}</span>
      <span class="day">${DAY_JA[weekdayKey(date)]}</span>
      <span class="times ${slot ? '' : 'off'}"></span>
      <span class="sub">›</span></div>`);
    row.querySelector('.times').textContent = slot ? expandTimes(slot).join('  ') : 'なし';
    if (source === 'override') row.querySelector('.times').append(el('<span class="chip">例外</span>'));
    row.onclick = () => openDay(date);
    up.append(row);
  }

  const wk = $('weekly');
  wk.innerHTML = '';
  for (const d of ORDER) {
    const slot = data.weekly[d];
    const row = el(`<div class="row">
      <span class="day">${DAY_JA[d]}</span>
      <label class="switch"><input type="checkbox" ${slot ? 'checked' : ''}></label>
      <input type="time" value="${slot ? slot.time : '06:30'}" ${slot ? '' : 'disabled'}>
      <span class="grow"></span>
      <select aria-label="間隔" ${slot ? '' : 'disabled'}></select>
      <select aria-label="回数" ${slot ? '' : 'disabled'}></select>
    </div>`);
    const [chk, time, interval, extra] = row.querySelectorAll('input, select');
    options(interval, [1, 2, 3, 5, 10, 15], '分', slot?.interval ?? 5);
    options(extra, [0, 1, 2, 3, 4, 5], '回', slot?.extra ?? 0);
    const update = () => {
      data.weekly[d] = chk.checked ? { time: time.value || '06:30', extra: +extra.value, interval: +interval.value } : null;
      markDirty();
    };
    chk.onchange = time.onchange = interval.onchange = extra.onchange = update;
    wk.append(row);
  }

  const ov = $('overrides');
  ov.innerHTML = '';
  const entries = Object.entries(data.overrides).filter(([date]) => date >= today);
  if (!entries.length) ov.append(el('<div class="empty">なし（上の日付をタップすると追加できます）</div>'));
  for (const [date, slot] of entries) {
    const row = el(`<div class="row">
      <span class="date">${date.slice(5).replace('-', '/')}</span>
      <span class="day">${DAY_JA[weekdayKey(date)]}</span>
      <span class="times"></span>
      <button class="danger" aria-label="削除">削除</button></div>`);
    row.querySelector('.times').textContent = describe(slot);
    row.querySelector('button').onclick = () => { delete data.overrides[date]; markDirty(); };
    ov.append(row);
  }
}

// ---------- per-day dialog ----------
function openDay(date) {
  const dlg = $('dayDialog');
  const hasOverride = Object.prototype.hasOwnProperty.call(data.overrides, date);
  const base = data.weekly[weekdayKey(date)];
  const slot = hasOverride ? data.overrides[date] : base;
  $('dlgTitle').textContent = `${date.replace(/-/g, '/')}（${DAY_JA[weekdayKey(date)]}）`;
  $('dlgBase').textContent = `基本パターン: ${describe(base)}`;
  $('dlgTime').value = slot?.time || base?.time || '06:30';
  options($('dlgInterval'), [1, 2, 3, 5, 10, 15], '分', slot?.interval ?? 5);
  options($('dlgExtra'), [0, 1, 2, 3, 4, 5], '回', slot?.extra ?? 0);
  dlg.querySelector(`input[value="${slot ? 'time' : 'off'}"]`).checked = true;
  $('dlgReset').hidden = !hasOverride;
  dlg.onclose = () => {
    if (dlg.returnValue === 'reset') { delete data.overrides[date]; markDirty(); }
    if (dlg.returnValue !== 'ok') return;
    const mode = dlg.querySelector('input[name="mode"]:checked').value;
    data.overrides[date] = mode === 'off' ? null
      : { time: $('dlgTime').value || '06:30', extra: +$('dlgExtra').value, interval: +$('dlgInterval').value };
    markDirty();
  };
  dlg.returnValue = '';
  dlg.showModal();
}

// ---------- GitHub ----------
function cfg() {
  return { repo: store.get('alarm.repo'), path: store.get('alarm.path') || 'alarms.json', token: store.get('alarm.token') };
}
function api(c) {
  return `https://api.github.com/repos/${c.repo}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`;
}
function headers(c) {
  return { Authorization: `Bearer ${c.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
}
function b64encode(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0)));
}

async function load() {
  const c = cfg();
  if (!c.repo || !c.token) {
    setStatus('未接続');
    $('settingsBox').open = true;
    render();
    return;
  }
  setStatus('読み込み中…');
  try {
    const res = await fetch(api(c) + `?t=${Date.now()}`, { headers: headers(c), cache: 'no-store' });
    if (res.status === 404) {
      data = emptyData(); sha = null;
      setStatus('新規ファイル（まだ保存されていません）');
    } else if (!res.ok) {
      throw new Error(`${res.status} ${(await res.json().catch(() => ({}))).message || ''}`);
    } else {
      const json = await res.json();
      data = { ...emptyData(), ...JSON.parse(b64decode(json.content)) };
      sha = json.sha;
      setStatus(data.updatedAt ? `更新 ${new Date(data.updatedAt).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}` : '読み込み完了');
    }
    dirty = false;
    $('saveBtn').disabled = true;
    $('saveBtn').textContent = '変更なし';
  } catch (e) {
    setStatus('読み込み失敗: ' + e.message, true);
  }
  render();
}

async function save() {
  const c = cfg();
  if (!c.repo || !c.token) { $('settingsBox').open = true; setStatus('先にGitHub接続を設定してください', true); return; }
  $('saveBtn').disabled = true;
  $('saveBtn').textContent = '保存中…';
  try {
    regenerate(data);
    const body = { message: 'Update alarms (web)', content: b64encode(JSON.stringify(data, null, 2) + '\n') };
    if (sha) body.sha = sha;
    const res = await fetch(api(c), { method: 'PUT', headers: { ...headers(c), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (res.status === 409 || res.status === 422) throw new Error('他の場所（Claudeなど）で先に更新されています。再読み込みしてからやり直してください');
    if (!res.ok) throw new Error(`${res.status} ${(await res.json().catch(() => ({}))).message || ''}`);
    sha = (await res.json()).content.sha;
    dirty = false;
    $('saveBtn').textContent = '保存しました';
    setStatus('保存しました。iPhoneは次の同期で反映されます');
  } catch (e) {
    $('saveBtn').disabled = false;
    $('saveBtn').textContent = '保存してiPhoneに反映';
    setStatus('保存失敗: ' + e.message, true);
  }
  render();
}

$('saveBtn').onclick = save;
$('cfgRepo').value = store.get('alarm.repo');
$('cfgPath').value = store.get('alarm.path');
$('cfgToken').value = store.get('alarm.token');
$('cfgSave').onclick = () => {
  store.set('alarm.repo', $('cfgRepo').value.trim());
  store.set('alarm.path', $('cfgPath').value.trim() || 'alarms.json');
  store.set('alarm.token', $('cfgToken').value.trim());
  $('settingsBox').open = false;
  load();
};
window.addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !dirty) load(); });
load();
</script>
</body>
</html>
