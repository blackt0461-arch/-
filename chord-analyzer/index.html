<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16161d">
  <title>ギターコード解析</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>ギターコード解析</h1>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" class="tab" id="tab-mic" aria-controls="panel-mic" aria-selected="true">🎤 マイク</button>
      <button type="button" role="tab" class="tab" id="tab-fret" aria-controls="panel-fret" aria-selected="false">🎸 指板</button>
    </nav>
  </header>

  <main>
    <section id="panel-mic" class="panel" role="tabpanel" aria-labelledby="tab-mic">
      <button type="button" id="mic-toggle" class="primary-button">マイクを開始</button>
      <p id="mic-error" class="error" hidden></p>
      <div id="mic-result" class="result" aria-live="polite"></div>
      <div id="chroma" class="chroma" aria-hidden="true"></div>
    </section>

    <section id="panel-fret" class="panel" role="tabpanel" aria-labelledby="tab-fret" hidden>
      <div class="controls">
        <label>チューニング
          <select id="tuning"></select>
        </label>
        <label>カポ
          <select id="capo"></select>
        </label>
      </div>
      <div class="shape-row">
        <input id="shape-input" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="例: x32010" aria-label="押さえ方（6弦から順に）">
        <button type="button" id="clear-shape" class="secondary-button">クリア</button>
      </div>
      <p id="shape-error" class="error" hidden>6弦分を「x32010」や「x-10-12-12-11-10」の形で入力してください</p>
      <div id="fret-result" class="result" aria-live="polite"></div>
      <div id="fretboard" class="fretboard"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
