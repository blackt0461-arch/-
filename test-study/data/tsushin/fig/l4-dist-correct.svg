<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220"><rect width="460" height="220" fill="#fff"/><polyline points="50,110 410,110" fill="none" stroke="#6a7092" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="50" cy="110" r="9" fill="#5b5cf0" stroke="#5b5cf0" stroke-width="2"/><circle cx="410" cy="110" r="9" fill="#5b5cf0" stroke="#5b5cf0" stroke-width="2"/><text x="50" y="144" text-anchor="middle" font-size="16" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">c<tspan baseline-shift="sub" font-size="12">0</tspan></text><text x="410" y="144" text-anchor="middle" font-size="16" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">c<tspan baseline-shift="sub" font-size="12">1</tspan></text><polyline points="175,98 175,122" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="285,98 285,122" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="50" y="80" width="125" height="14" rx="3" fill="#dcf5ec" stroke="#10a37f" stroke-width="1"/><rect x="285" y="80" width="125" height="14" rx="3" fill="#dcf5ec" stroke="#10a37f" stroke-width="1"/><text x="112.5" y="70" text-anchor="middle" font-size="16" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">t</text><text x="347.5" y="70" text-anchor="middle" font-size="16" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">t</text><text x="230.0" y="88" text-anchor="middle" font-size="14" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">1 以上</text><text x="112.5" y="168" text-anchor="middle" font-size="12" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">→ c<tspan baseline-shift="sub" font-size="9">0</tspan> に直す</text><text x="347.5" y="168" text-anchor="middle" font-size="12" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">c<tspan baseline-shift="sub" font-size="9">1</tspan> に直す ←</text><text x="230" y="26" text-anchor="middle" font-size="14" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">2つの符号語の距離 d</text><polyline points="230,34 54,34" fill="none" stroke="#6a7092" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><polygon points="54,34 62.3,30.5 62.3,37.5" fill="#6a7092"/><polyline points="230,34 406,34" fill="none" stroke="#6a7092" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><polygon points="406,34 397.7,37.5 397.7,30.5" fill="#6a7092"/><text x="230" y="200" text-anchor="middle" font-size="16" fill="#5b5cf0" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">t + 1 + t ≦ d　つまり　2t + 1 ≦ d</text></svg>