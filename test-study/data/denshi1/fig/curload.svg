<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 290" width="420" height="290"><rect width="420" height="290" fill="#fff"/><polyline points="50,250 400,250" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="400,250 391.7,253.5 391.7,246.5" fill="#1d2240"/><polyline points="50,250 50,30" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="50,30 53.5,38.3 46.5,38.3" fill="#1d2240"/><text x="396" y="272" text-anchor="end" font-size="14" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">V<tspan baseline-shift="sub" font-size="10">DS</tspan></text><text x="42" y="34" text-anchor="end" font-size="14" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">I<tspan baseline-shift="sub" font-size="10">D</tspan></text><polyline points="50,130 395,130" fill="none" stroke="#e5484d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="392" y="148" text-anchor="end" font-size="12" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">電流源 I<tspan baseline-shift="sub" font-size="9">0</tspan>（一定）</text><polyline points="50,250 90,150 395,120" fill="none" stroke="#1d2240" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="392" y="118" text-anchor="end" font-size="12" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">V<tspan baseline-shift="sub" font-size="9">IN</tspan> のとき</text><polyline points="50,250 90,136 395,106" fill="none" stroke="#5b5cf0" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="392" y="94" text-anchor="end" font-size="12" fill="#5b5cf0" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">V<tspan baseline-shift="sub" font-size="9">IN</tspan>+v<tspan baseline-shift="sub" font-size="9">in</tspan> のとき</text><circle cx="326.66666666666663" cy="130" r="5" fill="#1d2240"/><circle cx="161.0" cy="130" r="5" fill="#5b5cf0"/><polyline points="322.66666666666663,164 165.0,164" fill="none" stroke="#5b5cf0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="165.0,164 173.3,160.5 173.3,167.5" fill="#5b5cf0"/><text x="243.83333333333331" y="184" text-anchor="middle" font-size="12" fill="#5b5cf0" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">V<tspan baseline-shift="sub" font-size="9">OUT</tspan> が大きく下がる（逆相）</text><text x="250" y="40" text-anchor="middle" font-size="12" fill="#6a7092" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">特性線が寝ている（r<tspan baseline-shift="sub" font-size="9">0</tspan> が大きい）ので</text><text x="250" y="58" text-anchor="middle" font-size="12" fill="#6a7092" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">少し上にずれるだけで交点が大きく横へ動く</text></svg>