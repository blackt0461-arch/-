<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="440" height="230"><rect width="440" height="230" fill="#fff"/><text x="220" y="30" text-anchor="middle" font-size="14" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">ソース接地の利得：30dB 程度</text><rect x="14" y="50" width="196" height="130" rx="8" fill="#effaf6" stroke="#10a37f" stroke-width="2"/><text x="112" y="78" text-anchor="middle" font-size="14" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">講師の定義</text><text x="112" y="104" text-anchor="middle" font-size="13" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">10 log<tspan baseline-shift="sub" font-size="9">10</tspan>(v<tspan baseline-shift="sub" font-size="9">out</tspan>/v<tspan baseline-shift="sub" font-size="9">in</tspan>)</text><text x="112" y="136" text-anchor="middle" font-size="15" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">30dB = 10³</text><text x="112" y="162" text-anchor="middle" font-size="16" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">= 1000倍</text><rect x="230" y="50" width="196" height="130" rx="8" fill="#fff" stroke="#6a7092" stroke-width="2"/><text x="328" y="78" text-anchor="middle" font-size="14" fill="#6a7092" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">ふつうの電圧の dB</text><text x="328" y="104" text-anchor="middle" font-size="13" fill="#6a7092" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">20 log<tspan baseline-shift="sub" font-size="9">10</tspan>(v<tspan baseline-shift="sub" font-size="9">out</tspan>/v<tspan baseline-shift="sub" font-size="9">in</tspan>)</text><text x="328" y="136" text-anchor="middle" font-size="15" fill="#6a7092" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">30dB ≈ 32倍</text><text x="220" y="212" text-anchor="middle" font-size="13" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">テストでは左（30dB＝1000倍）で答える</text></svg>