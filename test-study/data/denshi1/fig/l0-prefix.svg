<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="440" height="230"><rect width="440" height="230" fill="#fff"/><polyline points="40,100 400,100" fill="none" stroke="#1d2240" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="80,92 80,108" fill="none" stroke="#10a37f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="80" cy="100" r="5" fill="#10a37f"/><text x="80" y="130" text-anchor="middle" font-size="16" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">0.001</text><text x="80" y="150" text-anchor="middle" font-size="13" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">m（ミリ）</text><polyline points="220,92 220,108" fill="none" stroke="#1d2240" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="220" cy="100" r="5" fill="#1d2240"/><text x="220" y="130" text-anchor="middle" font-size="16" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">1</text><text x="220" y="150" text-anchor="middle" font-size="13" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">そのまま</text><polyline points="360,92 360,108" fill="none" stroke="#e5484d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="360" cy="100" r="5" fill="#e5484d"/><text x="360" y="130" text-anchor="middle" font-size="16" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">1000</text><text x="360" y="150" text-anchor="middle" font-size="13" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">k（キロ）</text><path d="M210 82 Q150 40 92 82" fill="none" stroke="#10a37f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="100,76 91,83" fill="none" stroke="#10a37f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="91,83 95.4,75.1 99.7,80.7" fill="#10a37f"/><text x="150" y="48" text-anchor="middle" font-size="13" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">÷1000</text><path d="M230 82 Q290 40 348 82" fill="none" stroke="#e5484d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="340,76 349,83" fill="none" stroke="#e5484d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="349,83 340.3,80.7 344.6,75.1" fill="#e5484d"/><text x="290" y="48" text-anchor="middle" font-size="13" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">×1000</text><text x="80" y="175" text-anchor="middle" font-size="12" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">1 mA = 0.001 A</text><text x="360" y="175" text-anchor="middle" font-size="12" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">10 kΩ = 10000 Ω</text><rect x="60" y="190" width="320" height="30" rx="6" fill="#fff7d6" stroke="#c9a227" stroke-width="1.5"/><text x="220" y="211" text-anchor="middle" font-size="13" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">mA × kΩ = V（÷1000 と ×1000 で打ち消す）</text></svg>