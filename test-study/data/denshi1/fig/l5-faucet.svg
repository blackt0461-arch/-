span baseline-shift="sub" font-size="9">D</tspan>）はほぼ同じ</text><text x="220" y="278" text-anchor="middle" font-size="13" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">→ 変化に対しては抵抗が高い</text></svg>