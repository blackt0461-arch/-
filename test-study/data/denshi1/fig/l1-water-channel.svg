<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260"><rect width="440" height="260" fill="#fff"/><text x="220" y="24" text-anchor="middle" font-size="13" fill="#6a7092" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">横から見た水路（深さ＝電子の多さ）</text><rect x="70" y="42" width="300" height="14" rx="3" fill="#c9cdf2" stroke="#1d2240" stroke-width="2"/><text x="220.0" y="53" text-anchor="middle" font-size="12" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">ゲート（ふた）</text><path d="M70 60 L370 60 L70 150 Z" fill="#bfe3ff" stroke="#1d2240" stroke-width="2"/><polyline points="70,150 370,105" fill="none" stroke="#6a7092" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="370" y="168" text-anchor="end" font-size="12" fill="#6a7092" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">点線：V<tspan baseline-shift="sub" font-size="9">DS</tspan> が小さいとき</text><polyline points="94,78 126,78" fill="none" stroke="#5b5cf0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="126,78 117.7,81.5 117.7,74.5" fill="#5b5cf0"/><polyline points="154,78 186,78" fill="none" stroke="#5b5cf0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="186,78 177.7,81.5 177.7,74.5" fill="#5b5cf0"/><polyline points="214,78 246,78" fill="none" stroke="#5b5cf0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="246,78 237.7,81.5 237.7,74.5" fill="#5b5cf0"/><circle cx="370" cy="60" r="5" fill="#e5484d"/><text x="70" y="172" text-anchor="middle" font-size="13" fill="#5b5cf0" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">ソース側：深い</text><text x="378" y="82" text-anchor="start" font-size="13" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">出口で</text><text x="378" y="100" text-anchor="start" font-size="13" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">ゼロ</text><text x="220" y="205" text-anchor="middle" font-size="13" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">V<tspan baseline-shift="sub" font-size="9">DS</tspan> を上げるほど出口側が浅くなり、</text><text x="220" y="227" text-anchor="middle" font-size="13" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">ついに出口で水路がなくなる</text></svg>