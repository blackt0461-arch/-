ound"/><text x="340.0" y="136" text-anchor="middle" font-size="14" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">R<tspan baseline-shift="sub" font-size="10">2</tspan></text><text x="340" y="196" text-anchor="middle" font-size="12" fill="#6a7092" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">= 1 ÷ (1/R<tspan baseline-shift="sub" font-size="9">1</tspan> + 1/R<tspan baseline-shift="sub" font-size="9">2</tspan>)　道が2本で流れやすい</text></svg>