<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300"><rect width="460" height="300" fill="#fff"/><rect x="40" y="40" width="200" height="200" rx="0" fill="#dcdcfd" stroke="#1d2240" stroke-width="2"/><rect x="240" y="40" width="34" height="200" rx="0" fill="#d4f2e8" stroke="#10a37f" stroke-width="2"/><rect x="40" y="240" width="200" height="34" rx="0" fill="#d4f2e8" stroke="#10a37f" stroke-width="2"/><rect x="240" y="240" width="34" height="34" rx="0" fill="#fde0e0" stroke="#e5484d" stroke-width="2"/><text x="140.0" y="148.0" text-anchor="middle" font-size="24" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">1</text><text x="257.0" y="146.0" text-anchor="middle" font-size="16" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">x</text><text x="140.0" y="263.0" text-anchor="middle" font-size="16" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">x</text><text x="257.0" y="262.0" text-anchor="middle" font-size="12" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">x²</text><text x="140.0" y="30" text-anchor="middle" font-size="14" fill="#6a7092" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">1</text><text x="257.0" y="30" text-anchor="middle" font-size="14" fill="#6a7092" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">x</text><text x="292" y="60" text-anchor="start" font-size="14" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">(1+x)² の面積</text><text x="292" y="90" text-anchor="start" font-size="13" fill="#5b5cf0" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">= 1　大きな四角</text><text x="292" y="115" text-anchor="start" font-size="13" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">+ 2x　細い帯2本</text><text x="292" y="140" text-anchor="start" font-size="13" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">+ x²　小さな角</text><text x="292" y="180" text-anchor="start" font-size="13" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">x が小さいと</text><text x="292" y="200" text-anchor="start" font-size="13" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">x² はもっと小さい</text><text x="292" y="230" text-anchor="start" font-size="14" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">→ 捨てて ≈ 1+2x</text></svg>