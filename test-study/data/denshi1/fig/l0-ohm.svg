<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="420" height="230"><rect width="420" height="230" fill="#fff"/><polyline points="60,50 60,107.0" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="40,107.0 80,107.0" fill="none" stroke="#1d2240" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="50,121.0 70,121.0" fill="none" stroke="#1d2240" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="60,121.0 60,180" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="84" y="109.0" text-anchor="start" font-size="16" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">+</text><text x="78" y="133.0" text-anchor="start" font-size="16" fill="#6a7092" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">−</text><polyline points="60,50 200,50" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="200,50 200,93.0" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="200,93.0 208,98.5 192,104.0 208,109.5 192,115.0 208,120.5 192,126.0 208,131.5 200,137.0" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="200,137.0 200,180" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="214" y="120.0" text-anchor="start" font-size="14" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">R</text><polyline points="200,180 60,180" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="100,50 150,50" fill="none" stroke="#5b5cf0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polygon points="150,50 141.7,53.5 141.7,46.5" fill="#5b5cf0"/><text x="125" y="40" text-anchor="middle" font-size="14" fill="#5b5cf0" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">電流 I</text><text x="30" y="120" text-anchor="middle" font-size="18" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">V</text><text x="130" y="210" text-anchor="middle" font-size="12" fill="#6a7092" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">電池が押して、抵抗を通って流れる</text><polygon points="330,40 260,175 400,175" fill="#dcdcfd" stroke="#1d2240" stroke-width="2"/><polyline points="295,108 365,108" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="330,108 330,175" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="95" text-anchor="middle" font-size="22" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">V</text><text x="305" y="155" text-anchor="middle" font-size="22" fill="#5b5cf0" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">I</text><text x="355" y="155" text-anchor="middle" font-size="22" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">R</text><text x="330" y="200" text-anchor="middle" font-size="15" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">V = I × R</text><text x="330" y="220" text-anchor="middle" font-size="12" fill="#6a7092" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">I = V ÷ R　R = V ÷ I</text></svg>