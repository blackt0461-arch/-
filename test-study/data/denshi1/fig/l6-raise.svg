<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240"><rect width="440" height="240" fill="#fff"/><rect x="140" y="14" width="160" height="40" rx="8" fill="#fff" stroke="#1d2240" stroke-width="2"/><text x="220" y="40" text-anchor="middle" font-size="15" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">A<tspan baseline-shift="sub" font-size="11">V</tspan> = g<tspan baseline-shift="sub" font-size="11">m</tspan> × R<tspan baseline-shift="sub" font-size="11">out</tspan></text><polyline points="180,54 110,94" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="110,94 115.5,86.8 118.9,92.9" fill="#1d2240"/><polyline points="260,54 330,94" fill="none" stroke="#1d2240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="330,94 321.1,92.9 324.5,86.8" fill="#1d2240"/><rect x="14" y="96" width="196" height="100" rx="8" fill="#fdf0f0" stroke="#e5484d" stroke-width="2"/><text x="112" y="122" text-anchor="middle" font-size="14" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">g<tspan baseline-shift="sub" font-size="10">m</tspan> を大きくする</text><text x="112" y="146" text-anchor="middle" font-size="13" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">面積（W/L）と</text><text x="112" y="164" text-anchor="middle" font-size="13" fill="#1d2240" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">電流が増える</text><text x="112" y="186" text-anchor="middle" font-size="14" fill="#e5484d" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">× 不利</text><rect x="230" y="96" width="196" height="100" rx="8" fill="#effaf6" stroke="#10a37f" stroke-width="2"/><text x="328" y="122" text-anchor="middle" font-size="14" fill="#10a37f" font-weight="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">R<tspan baseline-shift="sub" font-si